name: CI
on:
  pull_request:
  push:
    branches: [main]

# Actions minutes are limited (3,000 a month on this plan). A new push to a PR stops the run still
# going for the old one, since only the newest result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The GitHub token only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_API_MODE: mock
      EXPO_PUBLIC_MOCK_LATENCY_MS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npx @redocly/cli lint api/openapi.yaml
      - run: node api/fixtures/check-fixtures.mjs
      - run: npm run gen:api && npm run gen:tokens && npm run copy:fixtures && npm run gen:media && npm run sync:server-shared && git diff --exit-code src/lib/api/schema.ts src/theme/tokens.ts src/mocks/fixtures src/mocks/media.ts server/src/shared server/seed

      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci

      - run: '! git grep -nI -i -e takeorder -e scanchop -- src app.config.ts'

      # The browser tests are the slow half of the run. They already passed on the PR, so the run
      # after merging into main skips them and keeps only the quick checks above.
      - run: npx expo export -p web
        if: github.event_name == 'pull_request'
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'pull_request'
      - run: npx playwright test
        if: github.event_name == 'pull_request'
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  server:
    # The Paystack sandbox slice (BUILD.md 2b). Its tests fake Paystack, so no keys are needed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
