name: Deploy server

# Sends server/ (and nothing else from the repo) to the Heroku app cravins-api when main changes it.
# Heroku builds it, runs `npm run db:migrate` in the release phase (server/Procfile), then swaps in
# the new version. Needs the repo secret HEROKU_API_KEY; without it the job fails and says why.
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

# The GitHub token only needs to read the code.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEROKU_APP: cravins-api
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Heroku key is set
        id: key
        run: |
          # Fail, don't skip: a green run that deployed nothing hid this once (2026-11-16).
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::HEROKU_API_KEY is not set in the repo's Actions secrets, so nothing was deployed."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack server/
        if: steps.key.outputs.ok == 'true'
        run: tar --exclude=node_modules --exclude=.env -czf "$RUNNER_TEMP/server.tgz" -C server .
      - name: Build on Heroku
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Accept: application/vnd.heroku+json; version=3" -H "Authorization: Bearer $HEROKU_API_KEY" -H "Content-Type: application/json" "$@"; }
          source=$(api -X POST "https://api.heroku.com/apps/$HEROKU_APP/sources")
          put_url=$(echo "$source" | jq -r .source_blob.put_url)
          get_url=$(echo "$source" | jq -r .source_blob.get_url)
          curl -sSf -X PUT -H "Content-Type:" --data-binary @"$RUNNER_TEMP/server.tgz" "$put_url"
          build=$(api -X POST "https://api.heroku.com/apps/$HEROKU_APP/builds" \
            -d "{\"source_blob\":{\"url\":\"$get_url\",\"version\":\"$GITHUB_SHA\"}}")
          id=$(echo "$build" | jq -r .id)
          # Show Heroku's build log here, so a failed build is readable in the Actions tab.
          curl -sSN "$(echo "$build" | jq -r .output_stream_url)" || true
          status=$(api "https://api.heroku.com/apps/$HEROKU_APP/builds/$id" | jq -r .status)
          echo "Build $id: $status"
          [ "$status" = "succeeded" ]
      - name: Check the release (migrations) and health
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Accept: application/vnd.heroku+json; version=3" -H "Authorization: Bearer $HEROKU_API_KEY" "$@"; }
          # The release phase runs the migrations; wait for it to finish.
          for _ in $(seq 1 30); do
            release=$(api -H "Range: version ..; order=desc, max=1" "https://api.heroku.com/apps/$HEROKU_APP/releases" | jq '.[0]')
            status=$(echo "$release" | jq -r .status)
            [ "$status" != "pending" ] && break
            sleep 10
          done
          echo "Release v$(echo "$release" | jq -r .version): $status"
          [ "$status" = "succeeded" ]
          url=$(api "https://api.heroku.com/apps/$HEROKU_APP" | jq -r .web_url)
          for _ in $(seq 1 12); do
            curl -sSf "${url}v1/health" && exit 0
            sleep 5
          done
          echo "::error::The server did not answer /v1/health"
          exit 1
