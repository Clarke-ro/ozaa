name: landing

on:
  pull_request:
  push:
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Astro needs a recent 22.x; the runner's cached 22 can be older, so ask for the newest.
          check-latest: true
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
