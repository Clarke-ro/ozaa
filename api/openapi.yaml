      operationId: ownerSetLoyalty
      summary: Set loyalty (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltyProgram' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyProgram' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /owner/venues/{venueId}/loyalty/members:
    get:
      tags: [owner-loyalty]
      operationId: ownerListLoyaltyMembers
      security: [{ ownerAuth: [] }]
      summary: Members with masked phone numbers and fact history. Only members who agreed to marketing can be messaged.
      parameters: [{ $ref: '#/components/parameters/VenueId' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LoyaltyCard' } }
                  nextCursor: { type: ['string', 'null'] }
  /owner/venues/{venueId}/loyalty/confirm:
    post:
      tags: [owner-loyalty]
      operationId: ownerConfirmRedemption
      security: [{ ownerAuth: [] }]
      summary: Confirm a guest's 6-character redemption claim code. Staff confirmation is the only debit.
      parameters: [{ $ref: '#/components/parameters/VenueId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Confirmed and debited on the member's card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyCard' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /owner/venues/{venueId}/dashboard:
    get:
      tags: [owner-orders]
      operationId: ownerGetDashboard
      summary: Today's sales, open tables, live orders, waiter calls, rating and alerts.
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: Figures for the owner home. Sales count only money already taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerDashboard' }
  /owner/venues/{venueId}/floor:
    get:
      tags: [owner-tables]
      operationId: ownerGetFloor
      summary: Tables with a derived status.
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: Status comes from orders and waiter calls. It is not stored on the table.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FloorTable' } }
  /owner/venues/{venueId}/transactions:
    get:
      tags: [owner-payouts]
      operationId: ownerListTransactions
      deprecated: true
      summary: "Old split model: charges and cash taken. The venue now sees online payments and refunds in its own Paystack dashboard (Clarke, 2026-11-08)."
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: Owner role only. Settlement is mocked until the live Paystack account exists.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VenueTransaction' } }
  /owner/transactions/{transactionId}/refund:
    post:
      tags: [owner-payouts]
      operationId: ownerRefundTransaction
      deprecated: true
      summary: "Old split model: refund a charge. Refunds now happen in the venue's own Paystack dashboard (Clarke, 2026-11-08)."
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TransactionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: The charge is marked refunded. Only a succeeded payment can be refunded, and only once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueTransaction' }
        '409': { description: The charge cannot be refunded. }
  /owner/venues/{venueId}/written-reviews:
    get:
      tags: [owner-reviews]
      operationId: ownerListWrittenReviews
      summary: Star ratings and the replies the owner has sent.
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: Written reviews. 1 to 3 stars stay private.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WrittenReview' } }
  /owner/written-reviews/{writtenReviewId}/reply:
    post:
      tags: [owner-reviews]
      operationId: ownerReplyToReview
      summary: Save a private reply on a written review.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WrittenReviewId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 400 }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WrittenReview' }
  /owner/venues/{venueId}/insights:
    get:
      tags: [owner-insights]
      operationId: ownerGetInsights
      summary: Sales, top dishes, peak hours and repeat guests.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: query
          name: range
          schema: { type: string, enum: [today, 7d, 30d, 90d, custom], default: 7d }
        - in: query
          name: since
          description: Required with range custom.
          schema: { type: string, format: date-time }
        - in: query
          name: until
          description: Required with range custom.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: "Worked out from the venue's real visits, orders and feedback. sample is only true for a demo venue."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsReport' }

  /owner/venues/{venueId}/sales:
    get:
      tags: [owner-insights]
      operationId: ownerGetSales
      summary: "Real order figures for a date range: value, counts by status, discounts, delivery fees, by source, top dishes and day by day."
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: query
          name: since
          description: Orders created at or after this moment. Leave out for all time.
          schema: { type: string, format: date-time }
        - in: query
          name: until
          description: Orders created before this moment.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }

  /owner/venues/{venueId}/feedback:
    get:
      tags: [owner-feedback]
      operationId: ownerListFeedback
      summary: List feedback items for a venue.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: query
          name: state
          schema: { type: string, enum: [all, new, archived], default: new }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: List of feedback.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FeedbackItem' }

  /owner/venues/{venueId}/feedback/{feedbackId}/archive:
    patch:
      tags: [owner-feedback]
      operationId: ownerArchiveFeedback
      summary: Archive or unarchive a feedback item.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: path
          name: feedbackId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archived]
              properties:
                archived: { type: boolean }
      responses:
        '200':
          description: Updated feedback item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackItem' }

  /owner/venues/{venueId}/feedback/ask:
    post:
      tags: [owner-feedback]
      operationId: ownerAskFeedbackAi
      summary: Ask AI assistant questions grounded on this venue's feedback.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: AI answer.
          content:
            application/json:
              schema:
                type: object
                required: [reply]
                properties:
                  reply: { type: string }
                  suggestions:
                    type: array
                    items: { type: string }

  /owner/venues/{venueId}/links:
    get:
      tags: [owner-links]
      operationId: ownerListCustomLinks
      summary: List custom link buttons.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
      responses:
        '200':
          description: List of custom links.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CustomLink' }
    post:
      tags: [owner-links]
      operationId: ownerCreateCustomLink
      summary: Create a custom link button.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomLinkInput' }
      responses:
        '201':
          description: Created custom link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomLink' }

  /owner/venues/{venueId}/links/{linkId}:
    patch:
      tags: [owner-links]
      operationId: ownerUpdateCustomLink
      summary: Update a custom link button.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: path
          name: linkId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomLinkInput' }
      responses:
        '200':
          description: Updated custom link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomLink' }
    delete:
      tags: [owner-links]
      operationId: ownerDeleteCustomLink
      summary: Delete a custom link button.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: path
          name: linkId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted.

  /owner/venues/{venueId}/loyalty/analytics:
    get:
      tags: [owner-loyalty]
      operationId: ownerGetLoyaltyAnalytics
      summary: Loyalty analytics KPIs and trend series.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: query
          name: range
          schema: { type: string, enum: ['7d', '30d', '90d'], default: '30d' }
      responses:
        '200':
          description: Loyalty analytics report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyAnalyticsReport' }

  /owner/venues/{venueId}/loyalty/customers:
    get:
      tags: [owner-loyalty]
      operationId: ownerListLoyaltyCustomers
      summary: List enrolled loyalty customers with offer preference filter.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: wantsOffers
          schema: { type: boolean }
        - in: query
          name: tag
          schema: { $ref: '#/components/schemas/CustomerTag' }
      responses:
        '200':
          description: "Enrolled loyalty customers, most recent visit first. `search` matches the name or the last 4 digits of the phone. totalCount is every member, before filters; countsByTag is per tag, before the tag filter."
          content:
            application/json:
              schema:
                type: object
                required: [items, totalCount]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LoyaltyCustomerSummary' }
                  totalCount: { type: integer }
                  countsByTag:
                    type: object
                    additionalProperties: { type: integer, minimum: 0 }

  /owner/venues/{venueId}/loyalty/scan:
    post:
      tags: [owner-loyalty]
      operationId: ownerScanLoyaltyCard
      summary: Scan a customer loyalty card QR to issue stamp or redeem.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrPayload, action]
              properties:
                qrPayload: { type: string }
                action: { type: string, enum: [stamp, redeem] }
      responses:
        '200':
          description: Scan result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyScanResult' }

  /owner/business:
    get:
      tags: [owner-business]
      operationId: ownerGetBusiness
      summary: Get business and its locations.
      security: [{ ownerAuth: [] }]
      responses:
        '200':
          description: Business details.
          content:
            application/json:
              schema:
                type: object
                required: [business, locations]
                properties:
                  business: { $ref: '#/components/schemas/Business' }
                  locations:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
    patch:
      tags: [owner-business]
      operationId: ownerUpdateBusiness
      summary: Update business details. Owners only.
      security: [{ ownerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessPatch' }
      responses:
        '200':
          description: Updated business.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }

  /owner/business/locations:
    post:
      tags: [owner-business]
      operationId: ownerCreateLocation
      summary: Add a new location.
      security: [{ ownerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: Created location.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }

  /owner/business/locations/{locationId}:
    patch:
      tags: [owner-business]
      operationId: ownerUpdateLocation
      summary: Update location details.
      security: [{ ownerAuth: [] }]
      parameters:
        - in: path
          name: locationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationPatchInput' }
      responses:
        '200':
          description: Updated location.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }

  /owner/venues/{venueId}/devices:
    get:
      tags: [owner-devices]
      operationId: ownerListScannerDevices
      summary: List paired scanner devices.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
      responses:
        '200':
          description: List of paired scanner devices.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScannerDevice' }

  /owner/venues/{venueId}/devices/pair:
    post:
      tags: [owner-devices]
      operationId: ownerPairScannerDevice
      summary: Pair a scanner device or generate a pairing code.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Paired device or generated pairing code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScannerDevice' }

  /owner/venues/{venueId}/devices/{deviceId}:
    delete:
      tags: [owner-devices]
      operationId: ownerRevokeScannerDevice
      summary: Revoke a paired scanner device.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Revoked.

  /owner/venues/{venueId}/staff/{staffId}:
    patch:
      tags: [owner-venue]
      operationId: ownerUpdateStaff
      summary: Change a staff member's role or the tables they look after.
      description: "Owner only, like the rest of staff. Nobody can be made owner here, and the owner's own role can't be changed (409)."
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { in: path, name: staffId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role:
                  type: string
                  enum: [manager, waiter, kitchen, viewer, staff_scanner]
                tableCodes:
                  type: array
                  maxItems: 200
                  items: { type: string }
                  description: The tables this person looks after. Empty means every table.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMember' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [owner-venue]
      operationId: ownerRevokeStaff
      summary: Revoke staff access. The server also ends their Clerk sessions.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: path
          name: staffId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Revoked.
  /owner/venues/{venueId}/staff/{staffId}/reset-pin:
    post:
      tags: [owner-venue]
      operationId: ownerResetStaffPin
      summary: Clear someone's sign-in PIN. They sign in with a code next time and set a new one.
      description: Owner only.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { in: path, name: staffId, required: true, schema: { type: string } }
      responses:
        '204':
          description: Cleared. hasPin is false from now.
        '404': { $ref: '#/components/responses/NotFound' }
  /owner/venues/{venueId}/staff/{staffId}/sign-out:
    post:
      tags: [owner-venue]
      operationId: ownerSignOutStaff
      summary: End someone's shift by signing them out on every device (the server revokes their Clerk sessions). They sign in again with a code.
      description: Owner only. Signing out the owner is refused (409); they use Sign out in Settings.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { in: path, name: staffId, required: true, schema: { type: string } }
      responses:
        '204':
          description: Signed out. onShift is false from now.
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/account:
    delete:
      tags: [auth]
      operationId: deleteAccount
      summary: Delete account and personal data.
      description: "Removes the owner's Clerk sign-in, profile and venues from the app. Paid orders, payments and tax lines are kept for 6 years with the personal data removed, because Ghana tax law requires the records."
      security: [{ ownerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmText]
              properties:
                confirmText: { type: string }
      responses:
        '204':
          description: Account deleted.

  # ---------------------------------------------------------------- owner: promos
  /owner/venues/{venueId}/promos:
    get:
      tags: [owner-promos]
      operationId: ownerListPromos
      summary: Every promo, with its state worked out now in the venue's time zone.
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Promo' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [owner-promos]
      operationId: ownerCreatePromo
      summary: Add a promo. Owners and managers only.
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promo' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /owner/venues/{venueId}/promos/{promoId}:
    patch:
      tags: [owner-promos]
      operationId: ownerUpdatePromo
      summary: Change a promo, or switch it on or off.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { in: path, name: promoId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoPatch' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Promo' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [owner-promos]
      operationId: ownerDeletePromo
      summary: Delete a promo. Orders that used it keep their discount.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { in: path, name: promoId, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- owner: notifications
  /owner/venues/{venueId}/notifications:
    get:
      tags: [owner-notifications]
      operationId: ownerListNotifications
      summary: Newest first. Orders, waiter calls, bill requests, guest notes and reviews for this venue. Poll every 5 s with the orders board.
      description: Read state is kept per staff member. Staff only get kinds their role may see.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: query
          name: kind
          schema: { $ref: '#/components/schemas/OwnerNotificationKind' }
        - in: query
          name: unread
          schema: { type: boolean }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount, countsByKind]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OwnerNotification' } }
                  unreadCount: { type: integer, minimum: 0 }
                  countsByKind:
                    type: object
                    description: Unread count per kind, for the filter chips.
                    additionalProperties: { type: integer, minimum: 0 }
                  nextCursor: { type: ['string', 'null'] }
  /owner/venues/{venueId}/notifications/read:
    post:
      tags: [owner-notifications]
      operationId: ownerMarkNotificationsRead
      summary: Mark some notifications, or all of them, as read for the signed-in staff member.
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
                  description: Leave out to mark every notification read.
      responses:
        '200':
          description: The new unread count.
          content:
            application/json:
              schema: { type: object, required: [unreadCount], properties: { unreadCount: { type: integer, minimum: 0 } } }

  # ---------------------------------------------------------------- owner: one loyalty customer
  /owner/venues/{venueId}/loyalty/customers/{customerId}:
    get:
      tags: [owner-loyalty]
      operationId: ownerGetLoyaltyCustomer
      summary: One loyalty member, their visits and what they agreed to.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { in: path, name: customerId, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyCustomerDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [owner-loyalty]
      operationId: ownerRemoveLoyaltyCustomer
      summary: Remove a member from this venue's loyalty card (Act 843 erasure on request).
      description: "Deletes their card, stamps, rewards and consent records at this venue. Paid orders stay for tax, with the member's name and phone removed."
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { in: path, name: customerId, required: true, schema: { type: string } }
      responses:
        '204':
          description: Removed.
        '404': { $ref: '#/components/responses/NotFound' }
  /owner/venues/{venueId}/loyalty/customers/{customerId}/stamp:
    post:
      tags: [owner-loyalty]
      operationId: ownerStampLoyaltyCustomer
      summary: Add a stamp to a member found by name, phone or card code, when their card can't be scanned. Same cooldown as a scan.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { in: path, name: customerId, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Stamp result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyScanResult' }
        '404': { $ref: '#/components/responses/NotFound' }
  /owner/venues/{venueId}/loyalty/scans:
    get:
      tags: [owner-loyalty]
      operationId: ownerListLoyaltyScans
      summary: Stamps and rewards given at this venue since a moment, newest first. Drives "Today" on Scan and stamp.
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: query
          name: since
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LoyaltyScanLogEntry' } } } }

  # ---------------------------------------------------------------- owner: profile
  /me/profile:
    patch:
      tags: [owner-profile]
      operationId: updateMyProfile
      summary: Change the signed-in staff member's own name, email, photo and app preferences. The phone changes in Clerk (the app verifies the new number with Clerk's code), and /me then shows it.
      security: [{ ownerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffProfilePatch' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUser' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    guestAuth:
      type: http
      scheme: bearer
      description: Token from POST /guest-sessions. Bound to one venue and table. Expires after 4 hours.
    loyaltyAuth:
      type: http
      scheme: bearer
      description: Guest token from POST /auth/otp/verify with purpose guest_loyalty (proves the phone number).
    ownerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Clerk session token for an owner or staff member, from Clerk's `getToken()` on our own sign-in
        screens. It lasts about a minute; Clerk renews it while the session lives. The server checks the
        signature with Clerk's public key, the expiry, and that `azp` is one of our app's origins. A staff
        member's venues and role come from the Cravins database, never from the token.

  headers:
    ETag:
      schema: { type: string }
      description: Send it back as If-None-Match to get 304 and save data.

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, format: uuid }
      description: A new UUID per user action. Reuse it when retrying the same action.
    LoyaltyTokenHeader:
      in: header
      name: X-Loyalty-Token
      required: false
      schema: { type: string }
      description: |
        The guest's loyalty token (POST /auth/otp/verify), sent beside the guest token when a call
        can also count toward their loyalty card, such as a game win earning a stamp. Without it
        the call works the same and nothing goes on a card.
    AcceptLanguage:
      in: header
      name: Accept-Language
      required: false
      schema: { type: string, example: tw }
    VenueSlug:
      in: path
      name: venueSlug
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    VenueId:
      in: path
      name: venueId
      required: true
      schema: { type: string, pattern: '^ven_[A-Za-z0-9]+$' }
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema: { type: string, pattern: '^txn_[A-Za-z0-9]+$' }
    WrittenReviewId:
      in: path
      name: writtenReviewId
      required: true
      schema: { type: string, pattern: '^rev_[A-Za-z0-9]+$' }
    OrderId:
      in: path
      name: orderId
      required: true
      schema: { $ref: '#/components/schemas/OrderId' }
    PaymentReference:
      in: path
      name: reference
      required: true
      schema: { type: string, description: Paystack transaction reference made by the Cravins server. }
    WaiterCallId:
      in: path
      name: waiterCallId
      required: true
      schema: { type: string, pattern: '^wcl_[A-Za-z0-9]+$' }
    CategoryId:
      in: path
      name: categoryId
      required: true
      schema: { type: string, pattern: '^cat_[A-Za-z0-9]+$' }
    MenuItemIdParam:
      in: path
      name: menuItemId
      required: true
      schema: { $ref: '#/components/schemas/MenuItemId' }
    TableId:
      in: path
      name: tableId
      required: true
      schema: { type: string, pattern: '^tbl_[A-Za-z0-9]+$' }
    Cursor:
      in: query
      name: cursor
      required: false
      schema: { type: string }

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Missing, expired or wrong token or code.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Logged in, but this role cannot do this.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Not found.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Something changed under you (for example an item sold out, or the order is already paid).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Valid shape, but the business rules say no (for example the venue has Pay switched off).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Slow down. See Retry-After.
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ProviderError:
      description: Paystack or the mobile network did not answer. Nothing was charged. Safe to retry with the same Idempotency-Key.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference, example: 'https://cravins.app/problems/item-sold-out' }
        title: { type: string, example: Item sold out }
        status: { type: integer }
        detail: { type: string, description: Safe to show to the user. Written in plain words. }
        code: { type: string, description: Stable machine code the app switches on., example: item_sold_out }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Field name to message, for form errors.

    Pesewas:
      type: integer
      minimum: 0
      description: Money in pesewas (1 GH₵ = 100 pesewas).
    Slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 48
      example: mamas-kitchen
    HexColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      example: '#B5432A'
    GhanaPhone:
      type: string
      description: Ghana mobile number in E.164 (+233 then 9 digits). The app accepts "024 123 4567" and converts it.
      pattern: '^\+[1-9][0-9]{6,14}$'
      example: '+233241234567'
    Language:
      type: string
      enum: [en, tw, ga, ee, fr]
      description: en English, tw Twi, ga Ga, ee Ewe, fr French.
    LocalizedText:
      type: object
      required: [en]
      properties:
        en: { type: string }
        tw: { type: string }
        ga: { type: string }
        ee: { type: string }
        fr: { type: string }
    Image:
      type: object
      required: [url, width, height]
      properties:
        url: { type: string, format: uri }
        width: { type: integer }
        height: { type: integer }
        blurhash: { type: string, description: Shown by expo-image while the photo loads. }
        alt: { type: string }
    OrderId:
      type: string
      pattern: '^ord_[A-Za-z0-9]+$'
    MenuItemId:
      type: string
      pattern: '^itm_[A-Za-z0-9]+$'
    LoyaltyToken:
      type: object
      required: [accessToken, expiresAt]
      description: Proves a guest's phone for loyalty calls. When it expires the guest asks for a new code.
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
    PinSignIn:
      type: object
      required: [signInToken]
      properties:
        signInToken: { type: string, description: 'One-time Clerk sign-in token (ticket strategy). Works once, for a few minutes. Never logged.' }
    StaffRole:
      type: string
      enum: [owner, manager, waiter, kitchen, viewer, staff_scanner]
      description: owner does everything incl. payment settings; manager everything except payment settings and staff; waiter orders and waiter calls; kitchen order status only.
    StaffUser:
      type: object
      required: [id, firstName, phone, venues]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: ['string', 'null'] }
        phone: { $ref: '#/components/schemas/GhanaPhone' }
        email: { type: ['string', 'null'], format: email }
        photo: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        prefs: { $ref: '#/components/schemas/StaffPrefs' }
        venues:
          type: array
          items:
            type: object
            required: [venueId, name, role]
            properties:
              venueId: { type: string }
              name: { type: string }
              role: { $ref: '#/components/schemas/StaffRole' }
    StaffMember:
      type: object
      required: [id, firstName, role, phoneMasked, status]
      properties:
        id: { type: string }
        firstName: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        phoneMasked: { type: string, example: '024 *** 4567' }
        status: { type: string, enum: [invited, active, removed] }
        lastName: { type: string }
        joinedAt: { type: string, format: date-time, description: When they accepted the invite. }
        lastActiveAt:
          type: ['string', 'null']
          format: date-time
          description: Last time they used the owner app. Null if never.
        onShift: { type: boolean, description: True while they are signed in on a device right now. }
        today:
          type: object
          description: What they did since the venue opened today.
          required: [ordersHandled, callsAnswered]
          properties:
            ordersHandled: { type: integer, description: Orders they moved to a new status. }
            callsAnswered: { type: integer }
            avgPickupMinutes: { type: ['integer', 'null'], description: Average time to answer a waiter call. }
            tipsPesewas:
              allOf: [{ $ref: '#/components/schemas/Pesewas' }]
              description: Tips on succeeded payments for orders at their tables today. Only succeeded payments count.
        tableCodes:
          type: array
          items: { type: string }
          description: The tables they look after. Empty or missing means every table.
        hasPin: { type: boolean, description: True when they have set a sign-in PIN. The PIN itself is never sent. }

    ServiceId:
      type: string
      enum: [menu, waiter, status, pay, wifi, loyalty, offers, review, play, reserve, events, feedback, about]
      description: Video menu is roadmap only and is not in this list.
    ServiceSection:
      type: string
      enum: [table, rewards, fun, more]
      description: table "At your table", rewards "Rewards", fun "Fun while you wait", more "More".
    FontPair:
      type: string
      enum: [cravins, serif, bold]
      description: cravins Unbounded+Inter, serif Noto Serif+Inter, bold Montserrat+Inter.
    OpeningHours:
      type: object
      required: [timezone, weekly]
      properties:
        timezone: { type: string, example: Africa/Accra }
        weekly:
          type: array
          description: Index 0 is Monday. An empty day means closed.
          minItems: 7
          maxItems: 7
          items:
            type: array
            items:
              type: object
              required: [opens, closes]
              properties:
                opens: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '09:00' }
                closes: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '22:00' }
        exceptions:
          type: array
          items:
            type: object
            required: [date, closed]
            description: "A day that differs from the week, such as a public holiday. Closed all day, or open with its own hours when closed is false."
            properties:
              date: { type: string, format: date }
              closed: { type: boolean }
              name: { type: string, maxLength: 40, description: "What the day is, e.g. Christmas Day. Shown to guests." }
              opens: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: Only when closed is false. }
              closes: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: Only when closed is false. }
    DerivedTheme:
      type: object
      description: Output of deriveTheme (design/prototype/theme.js). The app works it out locally for previews; the server value wins.
      required: [fill, onAccent, pressed, ink, tint, badgeInk, notes, cravinsDistance, ratios]
      properties:
        fill: { $ref: '#/components/schemas/HexColor' }
        onAccent: { $ref: '#/components/schemas/HexColor' }
        pressed: { $ref: '#/components/schemas/HexColor' }
        ink: { $ref: '#/components/schemas/HexColor' }
        tint: { $ref: '#/components/schemas/HexColor' }
        badgeInk: { $ref: '#/components/schemas/HexColor' }
        notes: { type: array, items: { type: string } }
        cravinsDistance: { type: number }
        ratios:
          type: object
          required: [buttonText, inkOnWhite, badge]
          properties:
            buttonText: { type: number }
            inkOnWhite: { type: number }
            badge: { type: number }
    VenueTheme:
      type: object
      required: [accent, fontPair, derived]
      properties:
        accent:
          description: Null means the Cravins default orange.
          oneOf: [{ $ref: '#/components/schemas/HexColor' }, { type: 'null' }]
        fontPair: { $ref: '#/components/schemas/FontPair' }
        derived: { $ref: '#/components/schemas/DerivedTheme' }
    ThemeInput:
      type: object
      required: [accent, fontPair]
      properties:
        accent:
          oneOf: [{ $ref: '#/components/schemas/HexColor' }, { type: 'null' }]
        fontPair: { $ref: '#/components/schemas/FontPair' }
    ServiceToggle:
      type: object
      required: [id, section, enabled]
      properties:
        id: { $ref: '#/components/schemas/ServiceId' }
        section: { $ref: '#/components/schemas/ServiceSection' }
        enabled: { type: boolean }
        subtitle: { type: string, description: 'Optional live line, e.g. "2 deals today".' }
    GameStampRule:
      type: object
      required: [enabled, minScore]
      properties:
        enabled: { type: boolean }
        minScore: { type: integer, minimum: 1, maximum: 200, example: 15 }
    ServiceSettings:
      type: object
      required: [services, game]
      properties:
        services: { type: array, items: { $ref: '#/components/schemas/ServiceToggle' } }
        game: { $ref: '#/components/schemas/GameStampRule' }
    OnlineOrdering:
      type: object
      required: [enabled, pickup, delivery]
      description: Orders from the menu link (not a table QR). Off until the owner turns it on.
      properties:
        enabled: { type: boolean, description: "The main switch. Off: the menu link shows the menu but takes no orders." }
        pickup:
          type: object
          required: [enabled, prepMinutes]
          properties:
            enabled: { type: boolean }
            prepMinutes: { type: integer, minimum: 0, maximum: 240, description: "How long until a pickup order is ready, shown to the customer." }
        delivery:
          type: object
          required: [enabled, minimumFeePesewas, feePerKmPesewas, maxDistanceKm]
          properties:
            enabled: { type: boolean }
            minimumFeePesewas: { $ref: '#/components/schemas/Pesewas' }
            feePerKmPesewas: { $ref: '#/components/schemas/Pesewas' }
            maxDistanceKm: { type: number, minimum: 0.5, maximum: 50, description: "No delivery beyond this distance from the venue." }
            freeOverPesewas:
              oneOf: [{ $ref: '#/components/schemas/Pesewas' }, { type: 'null' }]
              description: "Delivery is free when the food comes to at least this much. Null means never free."
    MenuStyle:
      type: object
      description: How the guest menu looks. Every field is optional; missing means the default shown.
      properties:
        itemSort:
          type: string
          enum: [manual, name, price_low, price_high, popular_first]
          description: Order of dishes inside each section. manual (default) keeps the owner's order; popular_first puts dishes with the popular badge first, then the owner's order.
        layout:
          type: string
          enum: [list, grid]
          description: How the menu opens (default list). Guests can still switch.
        colorScheme:
          type: string
          enum: [light, dark, auto]
          description: Guest pages in light (default) or dark, or auto to follow the guest's phone.
    StoreNotice:
      type: object
      required: [enabled, text]
      description: A message the venue shows on its guest pages, such as "Kitchen closes at 9 tonight".
      properties:
        enabled: { type: boolean, description: The owner's show/hide switch. }
        title: { type: string, maxLength: 60, description: Heading for the popup. The banner ignores it. }
        text: { type: string, minLength: 1, maxLength: 280 }
        startsAt: { type: ['string', 'null'], format: date-time, description: Shown from this moment. Null means straight away. }
        endsAt: { type: ['string', 'null'], format: date-time, description: Hidden from this moment. Null means until switched off. }
    StoreNotices:
      type: object
      description: At most one scrolling banner and one popup per venue.
      properties:
        banner: { oneOf: [{ $ref: '#/components/schemas/StoreNotice' }, { type: 'null' }] }
        popup: { oneOf: [{ $ref: '#/components/schemas/StoreNotice' }, { type: 'null' }] }
    VenuePublic:
      type: object
      required: [id, slug, name, description, location, hours, theme, banner, services, currency, languages, payEnabled]
      properties:
        id: { type: string }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, example: "Mama's Kitchen" }
        initials: { type: string, example: MK }
        description: { $ref: '#/components/schemas/LocalizedText' }
        location:
          type: object
          required: [label]
          properties:
            label: { type: string, example: 'Oxford Street, Osu, Accra' }
            lat: { type: number }
            lng: { type: number }
            mapsUrl: { type: string, format: uri }
        hours: { $ref: '#/components/schemas/OpeningHours' }
        phone: { $ref: '#/components/schemas/GhanaPhone' }
        whatsapp: { $ref: '#/components/schemas/GhanaPhone' }
        theme: { $ref: '#/components/schemas/VenueTheme' }
        banner: { $ref: '#/components/schemas/Image' }
        logo:
          description: Null shows initials in the venue colour.
          oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }]
        services: { type: array, items: { $ref: '#/components/schemas/ServiceToggle' }, description: Only switched-on services. }
        game: { $ref: '#/components/schemas/GameStampRule' }
        loyaltySummary:
          type: ['object', 'null']
          properties:
            stampsNeeded: { type: integer }
            rewardTitle: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        languages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        googleReviewUrl: { type: ['string', 'null'], format: uri }
        payEnabled: { type: boolean, description: "Older field, same as payMethods.online: true when the venue's own Paystack is connected." }
        payMethods: { $ref: '#/components/schemas/GuestPayMethods' }
        tagline: { type: string, maxLength: 100 }
        buttonTint: { type: string, enum: [auto, light, dark] }
        stylePreset: { type: string, enum: [default, classic, editorial, modern] }
        buttonOrder: { type: array, items: { type: string } }
        sectionOrder:
          type: array
          maxItems: 5
          items: { type: string, enum: [table, rewards, fun, more, socials] }
          description: "The order of the sections on the guest home (Branding > Guest home order). Sections left out keep their usual place after these."
        socials: { $ref: '#/components/schemas/SocialLinks' }
        menuStyle: { $ref: '#/components/schemas/MenuStyle' }
        onlineOrdering:
          allOf: [{ $ref: '#/components/schemas/OnlineOrdering' }]
          description: Missing means online ordering is off.
        published:
          type: boolean
          description: False while the owner is still setting up. Guest pages then say the menu isn't open yet, and ordering fails with venue_not_published. Missing means true.
        notices:
          allOf: [{ $ref: '#/components/schemas/StoreNotices' }]
          description: Only notices that are switched on and inside their start and end times right now. Missing or null parts mean nothing to show.
    VenueSettings:
      allOf:
        - { $ref: '#/components/schemas/VenuePublic' }
        - type: object
          properties:
            wifi: { $ref: '#/components/schemas/Wifi' }
            noticeSettings:
              allOf: [{ $ref: '#/components/schemas/StoreNotices' }]
              description: Every notice as the owner set it, including ones switched off or outside their times.
            tax: { $ref: '#/components/schemas/TaxSetup' }
            whatsappAlerts:
              oneOf: [{ $ref: '#/components/schemas/GhanaPhone' }, { type: 'null' }]
              description: "The number that gets new-order alerts on WhatsApp (Settings > Integrations). Owner only, never shown to guests. Null or missing means no alerts. Sending them waits for Phase 5."
    VenueSettingsPatch:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        description: { $ref: '#/components/schemas/LocalizedText' }
        location: { type: object, properties: { label: { type: string }, lat: { type: number }, lng: { type: number } } }
        hours: { $ref: '#/components/schemas/OpeningHours' }
        phone: { $ref: '#/components/schemas/GhanaPhone' }
        whatsapp: { $ref: '#/components/schemas/GhanaPhone' }
        bannerMediaId: { type: string }
        logoMediaId: { type: ['string', 'null'] }
        wifi: { $ref: '#/components/schemas/Wifi' }
        googleReviewUrl: { type: ['string', 'null'], format: uri }
        languages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        tagline: { type: string, maxLength: 100 }
        buttonTint: { type: string, enum: [auto, light, dark] }
        stylePreset: { type: string, enum: [default, classic, editorial, modern] }
        buttonOrder: { type: array, items: { type: string } }
        sectionOrder:
          type: array
          maxItems: 5
          items: { type: string, enum: [table, rewards, fun, more, socials] }
          description: "The order of the sections on the guest home (Branding > Guest home order). Sections left out keep their usual place after these."
        socials: { $ref: '#/components/schemas/SocialLinks' }
        noticeSettings: { $ref: '#/components/schemas/StoreNotices' }
        menuStyle: { $ref: '#/components/schemas/MenuStyle' }
        published: { type: boolean }
        onlineOrdering: { $ref: '#/components/schemas/OnlineOrdering' }
        tax: { $ref: '#/components/schemas/TaxSetup' }
        whatsappAlerts:
          oneOf: [{ $ref: '#/components/schemas/GhanaPhone' }, { type: 'null' }]
          description: "See VenueSettings.whatsappAlerts. Null turns the alerts off."
    Wifi:
      type: object
      required: [ssid, security]
      properties:
        ssid: { type: string, maxLength: 32 }
        password: { type: string, maxLength: 63 }
        security: { type: string, enum: [WPA, WPA2, WPA3, WEP, nopass, OPEN] }
        hidden: { type: boolean }
    Table:
      type: object
      required: [id, code]
      properties:
        id: { type: string }
        code: { type: string, example: '12' }
        label: { type: string, example: Table 12 }
        qrUrl: { type: string, format: uri, example: 'https://cravins.app/mamas-kitchen/t/12' }

    Dietary:
      type: string
      enum: [vegetarian, vegan, gluten_free, halal, spicy]
    MenuCategory:
      type: object
      required: [id, name, kind, position]
      properties:
        id: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        kind: { type: string, enum: [food, drinks], description: The Food and Drinks tabs. }
        position: { type: integer }
        hidden: { type: boolean }
        schedule:
          type: object
          properties:
            days: { type: array, items: { type: integer } }
            startTime: { type: string, example: '12:00' }
            endTime: { type: string, example: '15:00' }
    MenuCategoryInput:
      type: object
      required: [name, kind]
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        kind: { type: string, enum: [food, drinks] }
        position: { type: integer }
        hidden: { type: boolean }
        schedule:
          type: object
          properties:
            days: { type: array, items: { type: integer } }
            startTime: { type: string, example: '12:00' }
            endTime: { type: string, example: '15:00' }
    ModifierGroup:
      type: object
      required: [id, name, min, max, options]
      description: Add-ons like spice level or extra meat. min 1 and max 1 is a required single choice.
      properties:
        id: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        min: { type: integer, minimum: 0 }
        max: { type: integer, minimum: 1 }
        options:
          type: array
          items:
            type: object
            required: [id, name, pricePesewas]
            properties:
              id: { type: string }
              name: { $ref: '#/components/schemas/LocalizedText' }
              pricePesewas: { $ref: '#/components/schemas/Pesewas' }
    MenuItem:
      type: object
      required: [id, categoryId, name, description, pricePesewas, available, dietary, badges, modifierGroups]
      properties:
        id: { $ref: '#/components/schemas/MenuItemId' }
        categoryId: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        pricePesewas: { $ref: '#/components/schemas/Pesewas' }
        photo:
          oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }]
        gallery:
          type: array
          maxItems: 5
          description: Extra photos of the same dish, shown after `photo` on the dish page as swipeable pages. Empty or missing means only `photo` is shown.
          items: { $ref: '#/components/schemas/Image' }
        available: { type: boolean, description: False shows "Sold out" and blocks adding. }
        dietary: { type: array, items: { $ref: '#/components/schemas/Dietary' } }
        dietaryCustom:
          type: array
          maxItems: 6
          description: Diet labels the owner typed in beyond the standard set (for example "Keto"). Shown as tags on the dish; the guest diet filters use `dietary` only.
          items: { type: string, minLength: 1, maxLength: 24 }
        badges: { type: array, items: { type: string, enum: [popular, new, chef_pick] } }
        modifierGroups: { type: array, items: { $ref: '#/components/schemas/ModifierGroup' } }
        allergens: { type: array, items: { type: string } }
        calories: { type: integer }
        prepMinutes: { type: integer }
        hidden:
          type: boolean
          description: True keeps the dish off the guest menu without deleting it. Like a hidden category, it is still sent (the owner menu editor reads the same menu) and guest screens leave it out. Orders for it fail with item_sold_out. Missing means false.
        salePricePesewas:
          oneOf: [{ $ref: '#/components/schemas/Pesewas' }, { type: 'null' }]
          description: A promo price below pricePesewas. When set, the server charges it (plus add-ons) and guests see the normal price struck through. Null or missing means no sale.
        stockCount:
          type: ['integer', 'null']
          minimum: 0
          description: How many are left. Null or missing means unlimited. Each order takes away its quantity; at 0 the server sets available to false. An order for more than is left fails with item_sold_out.
        minQuantity:
          type: integer
          minimum: 1
          maximum: 50
          description: Smallest number a guest may order in one line. Missing means 1.
        maxQuantity:
          type: integer
          minimum: 1
          maximum: 50
          description: Largest number a guest may order in one line. Missing means 50. Outside min..max the order fails with quantity_out_of_range.
        position:
          type: integer
          minimum: 0
          description: Order inside its section when the venue sorts by its own order (itemSort manual). Lower comes first; dishes without one keep the order the menu lists them in, after those that have one.
    MenuItemInput:
      type: object
      properties:
        categoryId: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        pricePesewas: { $ref: '#/components/schemas/Pesewas' }
        photoMediaId: { type: ['string', 'null'] }
        available: { type: boolean }
        dietary: { type: array, items: { $ref: '#/components/schemas/Dietary' } }
        dietaryCustom:
          type: array
          maxItems: 6
          description: Diet labels the owner typed in beyond the standard set (for example "Keto"). Shown as tags on the dish; the guest diet filters use `dietary` only.
          items: { type: string, minLength: 1, maxLength: 24 }
        badges: { type: array, items: { type: string, enum: [popular, new, chef_pick] } }
        modifierGroups: { type: array, items: { $ref: '#/components/schemas/ModifierGroup' } }
        allergens: { type: array, items: { type: string } }
        calories: { type: integer }
        prepMinutes: { type: integer }
        hidden:
          type: boolean
          description: True keeps the dish off the guest menu without deleting it. Like a hidden category, it is still sent (the owner menu editor reads the same menu) and guest screens leave it out. Orders for it fail with item_sold_out. Missing means false.
        salePricePesewas:
          oneOf: [{ $ref: '#/components/schemas/Pesewas' }, { type: 'null' }]
          description: A promo price below pricePesewas. When set, the server charges it (plus add-ons) and guests see the normal price struck through. Null or missing means no sale.
        stockCount:
          type: ['integer', 'null']
          minimum: 0
          description: How many are left. Null or missing means unlimited. Each order takes away its quantity; at 0 the server sets available to false. An order for more than is left fails with item_sold_out.
        minQuantity:
          type: integer
          minimum: 1
          maximum: 50
          description: Smallest number a guest may order in one line. Missing means 1.
        maxQuantity:
          type: integer
          minimum: 1
          maximum: 50
          description: Largest number a guest may order in one line. Missing means 50. Outside min..max the order fails with quantity_out_of_range.
        position:
          type: integer
          minimum: 0
          description: Order inside its section when the venue sorts by its own order (itemSort manual). Lower comes first; dishes without one keep the order the menu lists them in, after those that have one.
    Menu:
      type: object
      required: [venueId, updatedAt, categories, items]
      properties:
        venueId: { type: string }
        updatedAt: { type: string, format: date-time }
        categories: { type: array, items: { $ref: '#/components/schemas/MenuCategory' } }
        items: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }

    OrderStatus:
      type: string
      enum: [received, accepted, preparing, ready, served, cancelled]
      description: >-
        Legal moves received->accepted->preparing->ready->served, and received, accepted or
        preparing->cancelled. `received` is a new order nobody has accepted yet; staff accept it
        before the kitchen starts cooking, and the guest sees it as accepted.
    PaymentStatusSummary:
      type: string
      enum: [unpaid, part_paid, paid, refunded]
    OrderLineInput:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId: { $ref: '#/components/schemas/MenuItemId' }
        quantity: { type: integer, minimum: 1, maximum: 50 }
        modifierOptionIds: { type: array, items: { type: string } }
        note: { type: string, maxLength: 140 }
    CreateOrderRequest:
      type: object
      required: [lines, clientOrderId]
      properties:
        clientOrderId: { type: string, format: uuid, description: Made on the phone so an offline retry never creates two orders. }
        lines: { type: array, minItems: 1, maxItems: 60, items: { $ref: '#/components/schemas/OrderLineInput' } }
        note: { type: string, maxLength: 200 }
        promoCode:
          type: string
          pattern: '^[A-Z0-9]{3,20}$'
          description: A promo code the guest typed. Fails with promo_not_valid when it doesn't apply now. Promos without a code apply on their own.
        fulfilment:
          allOf: [{ $ref: '#/components/schemas/OnlineFulfilment' }]
          description: "Required for a menu-link order. Fails with online_ordering_off, method_off, too_far or no_venue_location when it can't be met."
    OrderSource:
      type: string
      enum: [table, pickup, delivery]
      description: "Where an order came from: a table QR, or the menu link for pickup or delivery. Missing on older orders means table."
    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    OrderContact:
      type: object
      required: [name, phone]
      description: "How the venue reaches a menu-link customer. Kept on the order only, never in the guest session, a URL or a log (Act 843)."
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        phone: { $ref: '#/components/schemas/GhanaPhone' }
    OnlineFulfilment:
      type: object
      required: [type, contact]
      description: "Sent with an order from the menu link (a guest session with no table). Ignored for table orders."
      properties:
        type: { type: string, enum: [pickup, delivery] }
        contact: { $ref: '#/components/schemas/OrderContact' }
        address: { type: string, minLength: 1, maxLength: 200, description: "Delivery only: where the rider goes, in the customer's words." }
        location:
          allOf: [{ $ref: '#/components/schemas/GeoPoint' }]
          description: "Delivery only: the customer's phone position, shared with their permission. The fee uses the straight-line distance from the venue's map pin."
    OwnerCreateOrderRequest:
      allOf:
        - { $ref: '#/components/schemas/CreateOrderRequest' }
        - type: object
          properties:
            tableCode:
              type: ['string', 'null']
              description: The table it's for, or null for a counter or phone order.
    OrderLine:
      type: object
      required: [id, menuItemId, name, quantity, unitPricePesewas, totalPesewas, paid]
      properties:
        id: { type: string }
        menuItemId: { $ref: '#/components/schemas/MenuItemId' }
        name: { type: string }
        quantity: { type: integer }
        modifiers:
          type: array
          items:
            type: object
            required: [name, pricePesewas]
            properties:
              name: { type: string }
              pricePesewas: { $ref: '#/components/schemas/Pesewas' }
        unitPricePesewas: { $ref: '#/components/schemas/Pesewas' }
        totalPesewas: { $ref: '#/components/schemas/Pesewas' }
        note: { type: string }
        paid: { type: boolean, description: True once this line was paid in a "my items" split. }
        discountPesewas:
          allOf: [{ $ref: '#/components/schemas/Pesewas' }]
          description: "How much the sale price saved on this line (normal price minus sale price, times quantity), fixed when ordered. Missing means none." 
    TaxLine:
      type: object
      required: [code, label, amountPesewas]
      properties:
        code: { type: string, enum: [vat, nhil, getfund] }
        label: { type: string }
        amountPesewas: { $ref: '#/components/schemas/Pesewas' }
    Order:
      type: object
      required: [id, number, venueId, tableCode, status, paymentStatus, lines, subtotalPesewas, taxes, totalPesewas, paidPesewas, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/OrderId' }
        number: { type: integer, example: 24, description: Short number shown to guests and staff. Resets daily. }
        venueId: { type: string }
        tableCode: { type: ['string', 'null'] }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatusSummary' }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        subtotalPesewas: { $ref: '#/components/schemas/Pesewas' }
        taxes:
          type: array
          description: Empty until E-VAT is switched on (later phase). Then VAT 15%, NHIL 2.5% and GETFund 2.5% lines.
          items: { $ref: '#/components/schemas/TaxLine' }
        totalPesewas: { $ref: '#/components/schemas/Pesewas' }
        paidPesewas: { $ref: '#/components/schemas/Pesewas' }
        source: { $ref: '#/components/schemas/OrderSource' }
        paymentMethod:
          oneOf: [{ $ref: '#/components/schemas/PaymentMethodUsed' }, { type: 'null' }]
          description: Set when the order is paid. Null while unpaid.
        contact:
          oneOf: [{ $ref: '#/components/schemas/OrderContact' }, { type: 'null' }]
          description: Menu-link orders only.
        deliveryAddress: { type: ['string', 'null'] }
        deliveryFeePesewas:
          allOf: [{ $ref: '#/components/schemas/Pesewas' }]
          description: "Included in totalPesewas. 0 or missing for pickup and table orders."
        etaMinutes: { type: ['integer', 'null'] }
        promoDiscounts:
          type: array
          description: "Promos the server applied when the order was placed, already taken off totalPesewas. Missing or empty means none."
          items: { $ref: '#/components/schemas/AppliedPromo' }
        cancelReason: { type: ['string', 'null'], maxLength: 200, description: Why staff rejected or cancelled it. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        readyAt: { type: ['string', 'null'], format: date-time }
        servedAt: { type: ['string', 'null'], format: date-time }
    AppliedPromo:
      type: object
      required: [promoId, name, pesewas]
      properties:
        promoId: { type: string }
        name: { type: string }
        pesewas: { $ref: '#/components/schemas/Pesewas' }
    OrderPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        nextCursor: { type: ['string', 'null'] }

    BillQuoteRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [whole, equal, items] }
        parts: { type: integer, minimum: 2, maximum: 20, description: Needed for equal. }
        lineIds: { type: array, items: { type: string }, description: Needed for items. }
        tip:
          type: object
          properties:
            percent: { type: integer, enum: [0, 5, 10, 15] }
            customPesewas: { $ref: '#/components/schemas/Pesewas' }
    BillQuote:
      type: object
      required: [quoteId, orderId, sharePesewas, tipPesewas, totalPesewas, remainingAfterPesewas, expiresAt]
      properties:
        quoteId: { type: string }
        orderId: { $ref: '#/components/schemas/OrderId' }
        sharePesewas: { $ref: '#/components/schemas/Pesewas' }
        tipPesewas: { $ref: '#/components/schemas/Pesewas' }
        feePesewas:
          description: The part of Paystack's fee the venue passes to the guest (FeePassing). Missing or 0 when it keeps the fee. Not part of the bill, so it never pays off food.
          allOf: [{ $ref: '#/components/schemas/Pesewas' }]
        totalPesewas:
          description: What the guest pays now (share + tip + fee).
          allOf: [{ $ref: '#/components/schemas/Pesewas' }]
        remainingAfterPesewas: { $ref: '#/components/schemas/Pesewas' }
        expiresAt: { type: string, format: date-time }
    MomoProvider:
      type: string
      enum: [mtn, vod, atl]
      description: Paystack provider codes. mtn MTN MoMo, vod Telecel Cash, atl AT Money (AirtelTigo).
    InitializePaymentRequest:
      type: object
      required: [quoteId, method]
      properties:
        quoteId: { type: string }
        method: { type: string, enum: [momo, card] }
        momo:
          type: object
          required: [phone, provider]
          properties:
            phone: { $ref: '#/components/schemas/GhanaPhone' }
            provider: { $ref: '#/components/schemas/MomoProvider' }
        email: { type: string, format: email, description: Optional receipt email. The server uses a placeholder when missing because Paystack needs one. }
    PaymentStatus:
      type: string
      enum: [pending, pay_offline, open_url, succeeded, failed, abandoned]
      description: See the Payment state machine in BUILD.md. Only `succeeded` puts money on the order.
    Payment:
      type: object
      required: [id, reference, orderId, method, amountPesewas, currency, status, createdAt, testMode]
      properties:
        id: { type: string }
        reference: { type: string }
        orderId: { $ref: '#/components/schemas/OrderId' }
        method: { type: string, enum: [momo, card] }
        provider: { $ref: '#/components/schemas/MomoProvider' }
        amountPesewas: { $ref: '#/components/schemas/Pesewas' }
        tipPesewas: { $ref: '#/components/schemas/Pesewas' }
        feePesewas:
          description: The Paystack fee the guest paid, inside amountPesewas. Shown on the receipt as its own line.
          allOf: [{ $ref: '#/components/schemas/Pesewas' }]
        currency: { type: string, const: GHS }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        displayText: { type: string, description: 'Text from Paystack for pay_offline, e.g. approve on your phone.' }
        authorizationUrl: { type: string, format: uri, description: Card checkout URL for open_url. }
        approveBy: { type: ['string', 'null'], format: date-time, description: createdAt + 180 s for MoMo. }
        failureReason: { type: string, description: 'Plain words, safe to show.' }
        createdAt: { type: string, format: date-time }
        paidAt: { type: ['string', 'null'], format: date-time }
        testMode: { type: boolean, description: True when the venue's Paystack keys are test keys. Show a "Test payment" label. }

    WaiterReason:
      type: string
      enum: [water, bill, cutlery, order_more, clean_table, other]
    WaiterCall:
      type: object
      required: [id, tableCode, reason, status, createdAt]
      properties:
        id: { type: string }
        tableCode: { type: string }
        reason: { $ref: '#/components/schemas/WaiterReason' }
        note: { type: string }
        status: { type: string, enum: [open, acknowledged, resolved] }
        staffFirstName: { type: ['string', 'null'], example: Kwesi }
        createdAt: { type: string, format: date-time }
        acknowledgedAt: { type: ['string', 'null'], format: date-time }
        resolvedAt: { type: ['string', 'null'], format: date-time }
        reply: { type: ['string', 'null'], maxLength: 80, description: The staff reply the guest sees on their phone. }
        repliedAt: { type: ['string', 'null'], format: date-time }
        snoozedUntil: { type: ['string', 'null'], format: date-time, description: Owner app only. Hidden from the queue until this moment. }

    ConsentInput:
      type: object
      required: [loyalty, marketing, textVersion]
      description: Act 843. Store what was agreed, when, and the exact text version shown.
      properties:
        loyalty: { type: boolean, const: true, description: Must be true to join. }
        marketing: { type: boolean, description: Separate and unticked by default. WhatsApp or SMS promos only if true. }
        textVersion: { type: string, example: consent-2026-10-v1 }
    LoyaltyEarnMode:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, const: stamps }
        - type: object
          required: [kind, points, perMinor]
          properties:
            kind: { type: string, const: points }
            points: { type: integer, minimum: 1 }
            perMinor: { type: integer, minimum: 1 }
    LoyaltyTierBand:
      type: object
      required: [id, minLifetime]
      properties:
        id: { type: string, enum: [bronze, silver, gold] }
        minLifetime: { type: integer, minimum: 0 }
    RewardOffer:
      type: object
      required: [id, title, cost]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 80, example: Free jollof & chicken }
        cost: { type: integer, minimum: 1 }
    LoyaltyProgram:
      type: object
      required: [enabled, currency, earn, tiers, rewards, expiryDays, claimTtlSeconds, birthdayTreat]
      properties:
        enabled: { type: boolean }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: GHS }
        earn: { $ref: '#/components/schemas/LoyaltyEarnMode' }
        tiers:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/LoyaltyTierBand' }
        rewards:
          type: array
          items: { $ref: '#/components/schemas/RewardOffer' }
        expiryDays: { type: ['integer', 'null'], minimum: 1, description: Stamps older than this many days drop off the card. Null means they never expire. }
        stampOnPaidOrder:
          type: boolean
          description: "True adds a stamp on its own when a member's Cravins order is paid (Paystack succeeded). False means stamps only come from a scan. Missing means true."
        claimTtlSeconds: { type: integer, minimum: 60, maximum: 3600 }
        birthdayTreat: { type: ['string', 'null'] }
        memberCount: { type: integer, readOnly: true }
        programKind: { type: string, enum: [rewards_pass, stamp_card, both] }
        cooldown: { type: string, enum: [none, 1h, 4h, 1d] }
        lockscreenMessage: { type: string, maxLength: 60 }
        stampsRequired: { type: integer }
        secondTierReward: { type: string }
        secondTierStamps: { type: integer }
        automations:
          type: object
          properties:
            welcomeReward: { type: string }
            birthdayReward: { type: string }
            winbackDays: { type: integer }
            winbackReward: { type: string }
            reviewAskReward: { type: string }
        passAppearance:
          type: object
          properties:
            bgHex: { $ref: '#/components/schemas/HexColor' }
            textHex: { $ref: '#/components/schemas/HexColor' }
            coverUrl: { type: string }
            logoUrl: { type: string }
    LoyaltyEarnSource:
      oneOf:
        - type: object
          required: [type, orderId, amountMinor, currency]
          properties:
            type: { type: string, const: paid_visit }
            orderId: { type: string }
            amountMinor: { $ref: '#/components/schemas/Pesewas' }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
        - type: object
          required: [type, runId, day]
          properties:
            type: { type: string, const: game }
            runId: { type: string }
            day: { type: string, format: date }
        - type: object
          required: [type, year, title]
          properties:
            type: { type: string, const: birthday }
            year: { type: string }
            title: { type: string }
    LoyaltyFact:
      oneOf:
        - type: object
          required: [kind, id, at, units, source]
          properties:
            kind: { type: string, const: earn }
            id: { type: string }
            at: { type: string, format: date-time }
            units: { type: integer, minimum: 0 }
            source: { $ref: '#/components/schemas/LoyaltyEarnSource' }
        - type: object
          required: [kind, id, at, code, rewardId, title, units, expiresAt]
          properties:
            kind: { type: string, const: claim }
            id: { type: string }
            at: { type: string, format: date-time }
            code: { type: string, pattern: '^[A-Z0-9]{6}$' }
            rewardId: { type: string }
            title: { type: string }
            units: { type: integer, minimum: 1 }
            expiresAt: { type: string, format: date-time }
        - type: object
          required: [kind, id, at, claimId, rewardId, title, units]
          properties:
            kind: { type: string, const: confirm }
            id: { type: string }
            at: { type: string, format: date-time }
            claimId: { type: string }
            rewardId: { type: string }
            title: { type: string }
            units: { type: integer, minimum: 1 }
    LoyaltyMember:
      type: object
      required: [id, firstName, phoneMasked, birthdayMonthDay, memberSince, consent, facts]
      properties:
        id: { type: string }
        firstName: { type: ['string', 'null'] }
        phoneMasked: { type: string }
        birthdayMonthDay: { type: ['string', 'null'] }
        memberSince: { type: string, format: date }
        consent:
          type: object
          required: [marketing, at, textVersion]
          properties:
            marketing: { type: boolean }
            at: { type: string, format: date-time }
            textVersion: { type: string }
        facts:
          type: array
          items: { $ref: '#/components/schemas/LoyaltyFact' }
    LoyaltyCard:
      type: object
      required: [programme, member]
      properties:
        programme: { $ref: '#/components/schemas/LoyaltyProgram' }
        member: { $ref: '#/components/schemas/LoyaltyMember' }

    LeaderboardEntry:
      type: object
      required: [rank, nickname, score]
      properties:
        rank: { type: integer }
        nickname: { type: string }
        score: { type: integer }
        sample: { type: boolean }
    Offer:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { $ref: '#/components/schemas/LocalizedText' }
        detail: { $ref: '#/components/schemas/LocalizedText' }
        menuItemId: { $ref: '#/components/schemas/MenuItemId' }
        endsAt: { type: ['string', 'null'], format: date-time }

    ManualPaymentMethod:
      type: string
      enum: [cash, card_machine, bank_transfer, momo_merchant]
    PaymentMethodUsed:
      type: string
      enum: [online_card, online_momo, cash, card_machine, bank_transfer, momo_merchant]
      description: How an order was paid. Online ones come from Paystack (through the venue's own account); the rest are marked by staff.
    ManualPayments:
      type: object
      required: [cash, cardMachine, bankTransfer, momo]
      properties:
        cash: { type: boolean }
        cardMachine: { type: boolean, description: A card machine (POS terminal) at the counter. }
        bankTransfer:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            bankName: { type: string, maxLength: 60 }
            accountName: { type: string, maxLength: 60 }
            accountNumber: { type: string, maxLength: 30 }
        momo:
          type: object
          required: [enabled]
          description: The venue's own MoMo merchant number, shown to guests to send money to.
          properties:
            enabled: { type: boolean }
            network: { $ref: '#/components/schemas/MomoProvider' }
            number: { $ref: '#/components/schemas/GhanaPhone' }
            name: { type: string, maxLength: 60, description: "The name guests see when they send, to check it's right." }
    PaystackConnection:
      type: object
      required: [mode, publicKey, secretKeyHint, connectedAt]
      properties:
        mode: { type: string, enum: [test, live] }
        publicKey: { type: string, description: "Safe to show; it starts with pk_test_ or pk_live_." }
        secretKeyHint: { type: string, example: '••••1a2b', description: The last 4 characters only. The secret key itself is never returned. }
        connectedAt: { type: string, format: date-time }
        lastCheckedAt: { type: ['string', 'null'], format: date-time }
    PaystackKeysInput:
      type: object
      required: [mode, publicKey, secretKey]
      properties:
        mode: { type: string, enum: [test, live] }
        publicKey: { type: string, pattern: '^pk_(test|live)_[A-Za-z0-9]{10,}$' }
        secretKey: { type: string, writeOnly: true, pattern: '^sk_(test|live)_[A-Za-z0-9]{10,}$', description: "Sent once over HTTPS to be checked and stored encrypted. Never returned." }
    PaymentSettings:
      type: object
      required: [paystack, manual]
      properties:
        paystack:
          oneOf: [{ $ref: '#/components/schemas/PaystackConnection' }, { type: 'null' }]
          description: Null until the owner connects their own Paystack account.
        manual: { $ref: '#/components/schemas/ManualPayments' }
        feePassing:
          allOf: [{ $ref: '#/components/schemas/FeePassing' }]
          description: Missing means the venue keeps paying the whole fee.
    FeePassing:
      type: object
      required: [enabled, percent]
      description: >-
        How much of Paystack's fee (1.95% in Ghana) the guest pays on a payment in the app. 100 adds
        the whole fee, worked out so the venue still receives the full bill. Never applies to cash,
        card machine, bank transfer or MoMo to the venue's own number. The server works it out.
      properties:
        enabled: { type: boolean }
        percent: { type: integer, minimum: 1, maximum: 100, description: "Share of the fee the guest pays. 100 means all of it." }
    GuestPayMethods:
      type: object
      required: [online, cash, cardMachine]
      description: What a guest can use to pay at this venue. Built from the venue's payment settings; never includes a key.
      properties:
        online: { type: boolean, description: "True when the venue's Paystack is connected: card and MoMo prompt in the app." }
        testMode: { type: boolean, description: True while the venue uses Paystack test keys. Show a "Test payment" label. }
        feePercent:
          type: integer
          minimum: 1
          maximum: 100
          description: >-
            The share of Paystack's fee this venue passes to guests on in-app payments (FeePassing.percent),
            so the Pay screen can show the fee line before the guest pays. Missing when the venue keeps the
            whole fee or can't take payments in the app. The quote's feePesewas is still the figure charged.
        cash: { type: boolean }
        cardMachine: { type: boolean }
        bankTransfer:
          type: ['object', 'null']
          properties:
            bankName: { type: string }
            accountName: { type: string }
            accountNumber: { type: string }
        momo:
          type: ['object', 'null']
          properties:
            network: { $ref: '#/components/schemas/MomoProvider' }
            number: { $ref: '#/components/schemas/GhanaPhone' }
            name: { type: string }

    Currency:
      type: string
      enum: [GHS, NGN, KES, ZAR, XOF, USD]
      description: Sample venues use GHS. Amount fields are minor units (pesewas, kobo, cents) except XOF, which is the whole franc.
    OwnerDashboard:
      type: object
      required: [salesTodayPesewas, currency, changePercent, direction, openTables, liveOrders, openCalls, ratingAverage, ratingCount, alerts, ordersToday, pendingOrders, visitorsToday]
      properties:
        salesTodayPesewas: { $ref: '#/components/schemas/Pesewas' }
        ordersToday: { type: integer, minimum: 0, description: "Orders placed since midnight in the venue's time zone, not counting cancelled ones." }
        pendingOrders: { type: integer, minimum: 0, description: "New orders still waiting to be accepted (status received)." }
        visitorsToday: { type: integer, minimum: 0, description: "Guest visits since midnight in the venue's time zone. One table scan or one opened menu link is one visit; no guest is identified." }
        currency: { $ref: '#/components/schemas/Currency' }
        changePercent: { type: ['integer', 'null'], description: Versus the same venue yesterday. Null when yesterday was zero. }
        direction: { type: string, enum: [up, down, flat, none] }
        openTables: { type: integer }
        liveOrders: { type: integer }
        openCalls: { type: integer }
        ratingAverage: { type: ['number', 'null'] }
        ratingCount: { type: integer }
        alerts:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code:
                type: string
                enum: [calls, bills, payout, sold_out]
                description: payout belongs to the old split model and is no longer sent.
              count: { type: integer }
              detail: { type: string }
    FloorStatus:
      type: string
      enum: [free, seated, ordered, waiting_to_pay, needs_waiter]
    FloorTable:
      type: object
      required: [id, code, status]
      properties:
        id: { type: string }
        code: { type: string }
        label: { type: string }
        qrUrl: { type: string, format: uri }
        status: { $ref: '#/components/schemas/FloorStatus' }
        orderId: { type: ['string', 'null'] }
        orderNumber: { type: ['integer', 'null'] }
        orderStatus: { oneOf: [{ $ref: '#/components/schemas/OrderStatus' }, { type: 'null' }] }
        paymentStatus: { oneOf: [{ $ref: '#/components/schemas/PaymentStatusSummary' }, { type: 'null' }] }
        billPesewas: { oneOf: [{ $ref: '#/components/schemas/Pesewas' }, { type: 'null' }] }
        waiterCallId: { type: ['string', 'null'] }
        waiterReason: { oneOf: [{ $ref: '#/components/schemas/WaiterReason' }, { type: 'null' }] }
        since: { type: ['string', 'null'], format: date-time, description: When the table entered this status. Null for free tables. }
        waiterFirstName: { type: ['string', 'null'], description: "The staff member who looks after this table, if one is set." }
    VenueTransaction:
      type: object
      required: [id, reference, orderId, orderNumber, method, amountPesewas, currency, status, settlement, createdAt, testMode]
      properties:
        id: { type: string }
        reference: { type: string }
        orderId: { $ref: '#/components/schemas/OrderId' }
        orderNumber: { type: integer }
        method: { type: string, enum: [momo, card, cash] }
        provider: { $ref: '#/components/schemas/MomoProvider' }
        amountPesewas: { $ref: '#/components/schemas/Pesewas' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [succeeded, failed, abandoned, pending] }
        settlement: { type: string, enum: [pending, settled, refunded] }
        createdAt: { type: string, format: date-time }
        testMode: { type: boolean }
    WrittenReview:
      type: object
      required: [id, stars, firstName, createdAt]
      properties:
        id: { type: string }
        stars: { type: integer, minimum: 1, maximum: 5 }
        firstName: { type: string }
        text: { type: string }
        highlights:
          type: array
          items: { type: string, enum: [food, service, speed, value, vibe, cleanliness] }
        createdAt: { type: string, format: date-time }
        reply: { type: ['string', 'null'] }
    InsightsReport:
      type: object
      required: [range, currency, salesPesewas, series, topItems, peakHours, repeatGuests, sample]
      properties:
        range: { type: string, enum: [today, 7d, 30d, 90d, custom] }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        currency: { $ref: '#/components/schemas/Currency' }
        salesPesewas: { $ref: '#/components/schemas/Pesewas' }
        sample: { type: boolean, description: True only for a demo venue. Show the Sample label then. }
        scansCount: { type: integer, description: Table and menu-link QR scans. }
        menuViewsCount: { type: integer, description: Visits that opened the menu. }
        ordersCount: { type: integer, description: Visits that placed an order. }
        visitsByHour:
          type: array
          items:
            type: object
            required: [hour, visits]
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              visits: { type: integer }
        mood:
          type: object
          required: [positive, neutral, negative]
          properties:
            positive: { type: integer }
            neutral: { type: integer }
            negative: { type: integer }
        loyaltyMetrics:
          type: object
          properties:
            enrolled: { type: integer }
            active: { type: integer }
            rewardReady: { type: integer }
            redeemed: { type: integer }
        feedbackSentimentSeries:
          type: array
          items:
            type: object
            required: [date, positive, neutral, negative]
            properties:
              date: { type: string }
              positive: { type: integer }
              neutral: { type: integer }
              negative: { type: integer }
        loyaltySeries:
          type: array
          items:
            type: object
            required: [date, enrollments, stamps]
            properties:
              date: { type: string }
              enrollments: { type: integer }
              stamps: { type: integer }
        series:
          type: array
          items:
            type: object
            required: [label, pesewas]
            properties:
              label: { type: string }
              pesewas: { $ref: '#/components/schemas/Pesewas' }
        topItems:
          type: array
          items:
            type: object
            required: [name, count, pesewas]
            properties:
              name: { type: string }
              count: { type: integer }
              pesewas: { $ref: '#/components/schemas/Pesewas' }
        peakHours:
          type: array
          items:
            type: object
            required: [hour, orders]
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              orders: { type: integer }
        repeatGuests:
          type: object
          required: [count, sharePercent]
          properties:
            count: { type: integer }
            sharePercent: { type: integer, minimum: 0, maximum: 100 }

    SalesReport:
      type: object
      required: [currency, orderCount, valuePesewas, avgPesewas, byStatus, discountsPesewas, deliveryFeesPesewas, payments, bySource, topItems, days, byHour, byStaff, previous, tax]
      description: "Built from orders, not payments: what was ordered. Cancelled orders count in byStatus only, never in money."
      properties:
        currency: { $ref: '#/components/schemas/Currency' }
        orderCount: { type: integer, minimum: 0, description: Orders that weren't cancelled. }
        valuePesewas: { $ref: '#/components/schemas/Pesewas' }
        avgPesewas: { $ref: '#/components/schemas/Pesewas' }
        refundsPesewas: { $ref: '#/components/schemas/Pesewas' }
        previous:
          description: "The same length of time just before since. Null when there is no since, or the venue had no orders then."
          oneOf:
            - type: 'null'
            - type: object
              required: [since, until, orderCount, valuePesewas, avgPesewas]
              properties:
                since: { type: string, format: date-time }
                until: { type: string, format: date-time }
                orderCount: { type: integer, minimum: 0 }
                valuePesewas: { $ref: '#/components/schemas/Pesewas' }
                avgPesewas: { $ref: '#/components/schemas/Pesewas' }
        byHour:
          type: array
          description: Hours of the day in the venue's time zone that had orders.
          items:
            type: object
            required: [hour, orders, pesewas]
            properties:
              hour: { type: integer, minimum: 0, maximum: 23 }
              orders: { type: integer }
              pesewas: { $ref: '#/components/schemas/Pesewas' }
        byStaff:
          type: array
          description: Orders each staff member took or moved to served. Guest QR orders nobody touched are left out.
          items:
            type: object
            required: [staffId, firstName, role, orders, pesewas]
            properties:
              staffId: { type: string }
              firstName: { type: string }
              role: { $ref: '#/components/schemas/StaffRole' }
              orders: { type: integer }
              pesewas: { $ref: '#/components/schemas/Pesewas' }
        tax:
          description: "E-VAT and levies on these orders. Null until tax is set up in Settings."
          oneOf:
            - type: 'null'
            - type: object
              required: [vatPesewas, nhilPesewas, getfundPesewas, totalPesewas]
              properties:
                vatPesewas: { $ref: '#/components/schemas/Pesewas' }
                nhilPesewas: { $ref: '#/components/schemas/Pesewas' }
                getfundPesewas: { $ref: '#/components/schemas/Pesewas' }
                totalPesewas: { $ref: '#/components/schemas/Pesewas' }
        byStatus:
          type: object
          required: [received, accepted, preparing, ready, served, cancelled]
          properties:
            received: { type: integer }
            accepted: { type: integer }
            preparing: { type: integer }
            ready: { type: integer }
            served: { type: integer }
            cancelled: { type: integer }
        discountsPesewas: { $ref: '#/components/schemas/Pesewas' }
        deliveryFeesPesewas: { $ref: '#/components/schemas/Pesewas' }
        payments:
          type: object
          required: [onlinePesewas, inPersonPesewas, unpaidPesewas]
          description: "The order value split by how it was paid: online (Paystack, into the venue's own account), in person (marked by staff), or not yet."
          properties:
            onlinePesewas: { $ref: '#/components/schemas/Pesewas' }
            inPersonPesewas: { $ref: '#/components/schemas/Pesewas' }
            unpaidPesewas: { $ref: '#/components/schemas/Pesewas' }
            byMethod:
              type: array
              items:
                type: object
                required: [method, orders, pesewas]
                properties:
                  method: { $ref: '#/components/schemas/PaymentMethodUsed' }
                  orders: { type: integer }
                  pesewas: { $ref: '#/components/schemas/Pesewas' }
        bySource:
          type: array
          items:
            type: object
            required: [source, orders, pesewas]
            properties:
              source: { $ref: '#/components/schemas/OrderSource' }
              orders: { type: integer }
              pesewas: { $ref: '#/components/schemas/Pesewas' }
        topItems:
          type: array
          maxItems: 5
          items:
            type: object
            required: [name, count, pesewas]
            properties:
              name: { type: string }
              count: { type: integer }
              pesewas: { $ref: '#/components/schemas/Pesewas' }
        days:
          type: array
          description: One entry per calendar day in the venue's time zone that had orders, oldest first.
          items:
            type: object
            required: [date, orders, pesewas]
            properties:
              date: { type: string, example: '2026-11-04' }
              orders: { type: integer }
              pesewas: { $ref: '#/components/schemas/Pesewas' }
    FeedbackSentiment:
      type: string
      enum: [positive, neutral, negative]
    FeedbackItem:
      type: object
      required: [id, venueId, sentiment, score, text, archived, visibleAfter, createdAt]
      properties:
        id: { type: string, example: fbk_123 }
        venueId: { type: string }
        sentiment: { $ref: '#/components/schemas/FeedbackSentiment' }
        score: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        photoUrl: { type: ['string', 'null'] }
        contactName: { type: ['string', 'null'] }
        contactPhone: { type: ['string', 'null'] }
        archived: { type: boolean }
        visibleAfter: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    SocialLinks:
      type: object
      properties:
        googleReviewUrl: { type: ['string', 'null'], format: uri }
        instagram: { type: ['string', 'null'] }
        facebook: { type: ['string', 'null'] }
        tiktok: { type: ['string', 'null'] }
        tripadvisor: { type: ['string', 'null'] }
        whatsapp: { type: ['string', 'null'] }
        x: { type: ['string', 'null'] }
        youtube: { type: ['string', 'null'] }
        phone: { type: ['string', 'null'] }
        email: { type: ['string', 'null'] }
        website: { type: ['string', 'null'] }
        enabledLinks: { type: array, items: { type: string } }

    CustomLink:
      type: object
      required: [id, venueId, title, url, placement, sortOrder, clicks, enabled]
      properties:
        id: { type: string, example: lnk_123 }
        venueId: { type: string }
        title: { type: string }
        url: { type: string }
        icon: { type: string }
        placement: { type: string, enum: [button, banner, menu] }
        startDate: { type: ['string', 'null'], format: date-time }
        endDate: { type: ['string', 'null'], format: date-time }
        sortOrder: { type: integer }
        clicks: { type: integer }
        enabled: { type: boolean }
    CustomLinkInput:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string }
        icon: { type: string }
        placement: { type: string, enum: [button, banner, menu] }
        startDate: { type: ['string', 'null'], format: date-time }
        endDate: { type: ['string', 'null'], format: date-time }
        sortOrder: { type: integer }
        enabled: { type: boolean }

    LoyaltyCustomerSummary:
      type: object
      required: [id, name, phoneMasked, stamps, rewardsAvailable, wantsOffers, lastStampAt]
      properties:
        id: { type: string }
        name: { type: string }
        phoneMasked: { type: string }
        email: { type: ['string', 'null'] }
        stamps: { type: integer }
        rewardsAvailable: { type: integer }
        wantsOffers: { type: boolean }
        lastStampAt: { type: string, format: date-time }
        visitCount: { type: integer, minimum: 0, description: Paid visits at this venue. }
        firstVisitAt: { type: ['string', 'null'], format: date-time }
        lastVisitAt: { type: ['string', 'null'], format: date-time }
        spentPesewas: { $ref: '#/components/schemas/Pesewas' }
        tags:
          type: array
          description: Worked out from activity, never typed in.
          items: { $ref: '#/components/schemas/CustomerTag' }

    LoyaltyAnalyticsReport:
      type: object
      required: [range, enrolledCount, stampsIssued, rewardsRedeemed, newEnrollments, series]
      properties:
        range: { type: string, enum: ['7d', '30d', '90d'] }
        enrolledCount: { type: integer }
        stampsIssued: { type: integer }
        rewardsRedeemed: { type: integer }
        newEnrollments: { type: integer }
        series:
          type: array
          items:
            type: object
            required: [date, newEnrollments, stampsIssued, rewardsRedeemed]
            properties:
              date: { type: string }
              newEnrollments: { type: integer }
              stampsIssued: { type: integer }
              rewardsRedeemed: { type: integer }

    LoyaltyScanResult:
      type: object
      required: [success, card, customerName, stamps]
      properties:
        success: { type: boolean }
        card: { $ref: '#/components/schemas/LoyaltyCard' }
        customerName: { type: string }
        stamps: { type: integer }
        cooldownViolated: { type: boolean }
        cooldownRemainingSeconds: { type: integer }
        rewardUnlocked: { type: boolean }
        message: { type: string }

    Business:
      type: object
      required: [id, name, ownerId, plan]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        plan:
          type: string
          enum: [free, pro, business]
          description: The Cravins plan this business is on. Matches the plan ids on the pricing page. Billing is not live yet, so this is read-only.
        description: { type: ['string', 'null'], maxLength: 300, description: Shown on the menu link and Google profile. }
        categories:
          type: array
          maxItems: 8
          description: The first one is the main category.
          items: { $ref: '#/components/schemas/BusinessCategory' }
        cuisines: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 30 } }
        priceRange: { type: ['integer', 'null'], minimum: 1, maximum: 4 }
        yearOpened: { type: ['integer', 'null'], minimum: 1900, maximum: 2100 }
        website: { type: ['string', 'null'], maxLength: 200 }
        phone: { type: ['string', 'null'] }
        email: { type: ['string', 'null'], format: email }
        tin: { type: ['string', 'null'], description: Ghana Revenue Authority taxpayer number. Printed on receipts. }
        registrationNumber: { type: ['string', 'null'], description: Office of the Registrar of Companies number. }
    Location:
      type: object
      required: [id, businessId, slug, name, country, currency]
      properties:
        id: { type: string }
        businessId: { type: string }
        slug: { type: string }
        name: { type: string }
        email: { type: ['string', 'null'] }
        phone: { type: ['string', 'null'] }
        address1: { type: ['string', 'null'] }
        address2: { type: ['string', 'null'] }
        city: { type: ['string', 'null'] }
        postcode: { type: ['string', 'null'] }
        country: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        venueId: { type: string, description: "The venue this location runs. Every /owner/venues/{venueId} call uses it." }
        digitalAddress: { type: ['string', 'null'], pattern: '^[A-Z]{2}-[0-9]{3,4}-[0-9]{4}$', description: GhanaPostGPS code. }
        geo: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
        logo: { oneOf: [{ $ref: '#/components/schemas/Image' }, { type: 'null' }] }
        tableCount: { type: integer, minimum: 0 }
        staffCount: { type: integer, minimum: 0 }
    LocationInput:
      type: object
      required: [name, country]
      properties:
        name: { type: string }
        address1: { type: string }
        city: { type: string }
        postcode: { type: string }
        country: { type: string }
        isSeparateBusiness: { type: boolean }
    LocationPatchInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address1: { type: string }
        address2: { type: string }
        city: { type: string }
        postcode: { type: string }
        country: { type: string }
        digitalAddress: { type: ['string', 'null'], pattern: '^[A-Z]{2}-[0-9]{3,4}-[0-9]{4}$' }
        geo: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }

    ScannerDevice:
      type: object
      required: [id, venueId, name, pairedAt, lastSeen]
      properties:
        id: { type: string }
        venueId: { type: string }
        name: { type: string }
        platform: { type: string }
        pairedAt: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        pairingCode: { type: ['string', 'null'] }

    CustomerTag:
      type: string
      enum: [new, regular, quiet, reward_ready]
      description: "new: first visit in the last 30 days. regular: 5 or more visits. quiet: no visit for 30 days. reward_ready: a reward to claim."
    LoyaltyCustomerDetail:
      allOf:
        - { $ref: '#/components/schemas/LoyaltyCustomerSummary' }
        - type: object
          required: [stampsRequired, visits, consent]
          properties:
            stampsRequired: { type: integer, minimum: 1 }
            nextReward: { type: ['string', 'null'] }
            favouriteItem: { type: ['string', 'null'] }
            visits:
              type: array
              description: Newest first, at most 20.
              items:
                type: object
                required: [at, totalPesewas, stampAdded]
                properties:
                  at: { type: string, format: date-time }
                  orderId: { type: ['string', 'null'] }
                  orderNumber: { type: ['integer', 'null'] }
                  tableCode: { type: ['string', 'null'] }
                  source: { $ref: '#/components/schemas/OrderSource' }
                  summary: { type: string, description: "The dishes, short." }
                  totalPesewas: { $ref: '#/components/schemas/Pesewas' }
                  stampAdded: { type: boolean }
            consent:
              type: object
              required: [loyaltyAt, textVersion, marketing]
              properties:
                loyaltyAt: { type: string, format: date-time }
                textVersion: { type: string }
                marketing: { type: boolean }
                marketingAt: { type: ['string', 'null'], format: date-time }
    LoyaltyScanLogEntry:
      type: object
      required: [id, at, customerId, customerName, action]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        customerId: { type: string }
        customerName: { type: string }
        action: { type: string, enum: [stamp, reward] }
        stampsAfter: { type: integer }
        reward: { type: ['string', 'null'] }
        by: { type: ['string', 'null'], description: Staff first name or the scanner device name. }
    PromoKind:
      type: string
      enum: [percent_off, amount_off, free_item]
    PromoChannel:
      type: string
      enum: [all, table, online]
    PromoInput:
      type: object
      required: [name, kind, channel, enabled]
      description: "A rule the server applies to the bill before the guest pays. The best single promo wins; promos never stack."
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        kind: { $ref: '#/components/schemas/PromoKind' }
        percent: { type: ['integer', 'null'], minimum: 1, maximum: 100, description: percent_off only. Applies to drinks only when appliesTo is drinks. }
        amountPesewas: { oneOf: [{ $ref: '#/components/schemas/Pesewas' }, { type: 'null' }], description: amount_off only. }
        freeItemId: { type: ['string', 'null'], description: "free_item only. One of this dish comes free when it is on the order." }
        appliesTo: { type: string, enum: [order, category], description: Missing means the whole order. }
        categoryId: { type: ['string', 'null'], description: "With appliesTo category, only lines in this menu section are discounted." }
        minSpendPesewas: { oneOf: [{ $ref: '#/components/schemas/Pesewas' }, { type: 'null' }] }
        code: { type: ['string', 'null'], pattern: '^[A-Z0-9]{3,20}$', description: "Null applies on its own. With a code, the guest must type it." }
        channel: { $ref: '#/components/schemas/PromoChannel' }
        days:
          type: array
          maxItems: 7
          description: Days it runs, 0 is Monday. Empty means every day.
          items: { type: integer, minimum: 0, maximum: 6 }
        startTime: { type: ['string', 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$', description: Daily window in the venue's time zone. Null means all day. }
        endTime: { type: ['string', 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        startsAt: { type: ['string', 'null'], format: date-time }
        endsAt: { type: ['string', 'null'], format: date-time }
        usageLimit: { type: ['integer', 'null'], minimum: 1 }
        enabled: { type: boolean }
    PromoPatch:
      type: object
      minProperties: 1
      description: Any PromoInput fields to change.
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        kind: { $ref: '#/components/schemas/PromoKind' }
        percent: { type: ['integer', 'null'], minimum: 1, maximum: 100 }
        amountPesewas: { oneOf: [{ $ref: '#/components/schemas/Pesewas' }, { type: 'null' }] }
        freeItemId: { type: ['string', 'null'] }
        appliesTo: { type: string, enum: [order, category] }
        categoryId: { type: ['string', 'null'] }
        minSpendPesewas: { oneOf: [{ $ref: '#/components/schemas/Pesewas' }, { type: 'null' }] }
        code: { type: ['string', 'null'], pattern: '^[A-Z0-9]{3,20}$' }
        channel: { $ref: '#/components/schemas/PromoChannel' }
        days: { type: array, maxItems: 7, items: { type: integer, minimum: 0, maximum: 6 } }
        startTime: { type: ['string', 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        endTime: { type: ['string', 'null'], pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        startsAt: { type: ['string', 'null'], format: date-time }
        endsAt: { type: ['string', 'null'], format: date-time }
        usageLimit: { type: ['integer', 'null'], minimum: 1 }
        enabled: { type: boolean }
    Promo:
      allOf:
        - { $ref: '#/components/schemas/PromoInput' }
        - type: object
          required: [id, state, usageCount, createdAt]
          properties:
            id: { type: string }
            state:
              type: string
              enum: [running, scheduled, ended, off]
              description: "Worked out now. running: on and inside its dates (the daily window may still be closed). scheduled: starts later. ended: past endsAt or usage limit. off: switched off."
            usageCount: { type: integer, minimum: 0 }
            discountGivenPesewas: { $ref: '#/components/schemas/Pesewas' }
            createdAt: { type: string, format: date-time }
    OwnerNotificationKind:
      type: string
      enum: [order, call, bill, guest_note, review]
    OwnerNotification:
      type: object
      required: [id, kind, title, createdAt, readAt, needsAction, target]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/OwnerNotificationKind' }
        title: { type: string, example: Table 4 needs a waiter }
        detail: { type: ['string', 'null'], example: Asked for water }
        createdAt: { type: string, format: date-time }
        readAt: { type: ['string', 'null'], format: date-time }
        needsAction: { type: boolean, description: "True while the order, call or bill behind it is still open. Drives \"Needs you\"." }
        target:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [order, call, table, feedback, review] }
            id: { type: string }
    BusinessCategory:
      type: string
      enum: [restaurant, chop_bar, cafe, bar, lounge, fast_food, bakery, catering]
    BusinessPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 60 }
        description: { type: ['string', 'null'], maxLength: 300 }
        categories: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/BusinessCategory' } }
        cuisines: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 30 } }
        priceRange: { type: ['integer', 'null'], minimum: 1, maximum: 4 }
        yearOpened: { type: ['integer', 'null'], minimum: 1900, maximum: 2100 }
        website: { type: ['string', 'null'], maxLength: 200 }
        phone: { type: ['string', 'null'] }
        email: { type: ['string', 'null'], format: email }
        tin: { type: ['string', 'null'], pattern: '^[A-Z][0-9]{10}$' }
        registrationNumber: { type: ['string', 'null'], maxLength: 20 }
    TaxSetup:
      type: object
      required: [enabled, pricesIncludeTax]
      description: "E-VAT. Off by default. When on, orders carry VAT 15%, NHIL 2.5% and GETFund 2.5% tax lines, inside the menu price when pricesIncludeTax is true, or added on top when false."
      properties:
        enabled: { type: boolean }
        pricesIncludeTax: { type: boolean }
        tin: { type: ['string', 'null'], pattern: '^[A-Z][0-9]{10}$' }
    StaffPrefs:
      type: object
      required: [language, appearance, soundForNewOrders, notify]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        appearance: { type: string, enum: [light, dark, system] }
        soundForNewOrders: { type: boolean }
        notify:
          type: object
          required: [order, call, bill, guest_note, review]
          description: Which kinds show in Notifications and on the badges for this person.
          properties:
            order: { type: boolean }
            call: { type: boolean }
            bill: { type: boolean }
            guest_note: { type: boolean }
            review: { type: boolean }
    StaffProfilePatch:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 40 }
        lastName: { type: ['string', 'null'], maxLength: 40 }
        email: { type: ['string', 'null'], format: email }
        photoMediaId: { type: ['string', 'null'] }
        prefs: { $ref: '#/components/schemas/StaffPrefs' }
