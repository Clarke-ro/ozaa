openapi: 3.1.0
info:
  title: Cravins API
  version: 0.1.0
  summary: The fixed contract between the Cravins app (guest web + owner app) and the Cravins server.
  description: |
    The frontend is built first against a mock that follows this file exactly.
    The real server is built later to the same file. Change this file only in its own PR,
    and regenerate `src/lib/api/schema.ts` (openapi-typescript) in the same PR.

    Conventions:
    - Money is always an integer count of minor units (GH₵65.00 = 6500). The venue's `currency` says which unit. Sample venues are GHS. XOF stores the whole franc. Paystack charges in this build stay GHS.
    - Times are ISO 8601 strings in UTC (`2026-10-31T12:41:00Z`). The app shows them in the venue's time zone.
    - IDs are opaque strings with a prefix (`ven_`, `itm_`, `ord_`, `pay_`, `vrv_` ...). Never parse them.
    - Errors use Problem Details (RFC 9457) with `application/problem+json`.
    - Prices, totals, tips and fees are computed by the server. The app sends item ids and quantities only.
    - Every POST that creates something accepts an `Idempotency-Key` header. Retrying with the same key returns the first result.
    - Payment secrets (Paystack secret key) live only on the server. The app never sees them.
    - Guests never hold an account. A guest session is created from the QR code (venue slug + table code).
    - Owners and staff sign in with Clerk (clerk.com) on our own screens: Clerk texts the 6-digit code and
      keeps the session. The app sends Clerk's short-lived session token as the `ownerAuth` bearer token, and
      the server checks it against Clerk's public keys. There are no owner sign-in, refresh or log-out calls
      in this file; those happen between the app and Clerk.
servers:
  - url: https://api.cravins.app/v1
    description: Production (not live yet)
  - url: http://localhost:4000/v1
    description: Local server (Phase 5 and later)
tags:
  - name: auth
  - name: guest-session
  - name: venues
  - name: menu
  - name: orders
  - name: payments
  - name: waiter
  - name: loyalty
  - name: reviews
  - name: game
  - name: feedback
  - name: owner-venue
  - name: owner-menu
  - name: owner-tables
  - name: owner-orders
  - name: owner-reviews
  - name: owner-loyalty
  - name: owner-payouts
  - name: owner-insights
  - name: owner-feedback
  - name: owner-links
  - name: owner-business
  - name: owner-devices
  - name: owner-promos
  - name: owner-notifications
  - name: owner-profile
  - name: webhooks
security: []
paths:
  # ---------------------------------------------------------------- auth (guests joining loyalty; owners and staff use Clerk)
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Send a 6-digit code by SMS to a guest joining loyalty. Owners and staff sign in with Clerk instead.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { $ref: '#/components/schemas/GhanaPhone' }
                purpose: { type: string, enum: [guest_loyalty] }
      responses:
        '202':
          description: Code sent. Same response whether or not the number is known, so numbers cannot be probed.
          content:
            application/json:
              schema:
                type: object
                required: [expiresInSeconds, resendInSeconds]
                properties:
                  expiresInSeconds: { type: integer, example: 300 }
                  resendInSeconds: { type: integer, example: 30 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Exchange the SMS code for a loyalty token that proves the guest's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, purpose]
              properties:
                phone: { $ref: '#/components/schemas/GhanaPhone' }
                code: { type: string, pattern: '^[0-9]{6}$' }
                purpose: { type: string, enum: [guest_loyalty] }
      responses:
        '200':
          description: Phone proved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/pin:
    put:
      tags: [auth]
      operationId: setStaffPin
      summary: Set or change the signed-in staff member's 4-digit PIN for quick sign-in on this device.
      description: "Needs a Clerk session from the SMS code first. The server keeps only a slow hash of the PIN and never sends it back."
      security: [{ ownerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, deviceId]
              properties:
                pin: { type: string, pattern: '^[0-9]{4}$', writeOnly: true }
                deviceId: { type: string, description: The device the PIN works on. Other devices still need the SMS code. }
      responses:
        '204':
          description: Saved.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/pin/login:
    post:
      tags: [auth]
      operationId: loginWithPin
      summary: Sign in with a 4-digit PIN on a device where this person already signed in by SMS.
      description: |
        Five wrong PINs in a row clear the PIN; the person then signs in with the SMS code and sets a new one.
        A right PIN returns a one-time Clerk sign-in token. The app hands it to Clerk (the `ticket` sign-in
        strategy), which starts the session; it works once and only for a few minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, pin, deviceId]
              properties:
                phone: { $ref: '#/components/schemas/GhanaPhone' }
                pin: { type: string, pattern: '^[0-9]{4}$', writeOnly: true }
                deviceId: { type: string }
      responses:
        '200':
          description: PIN right. Finish signing in with Clerk using the token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PinSignIn' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in staff member.
      description: |
        The app calls this straight after Clerk signs someone in. The server matches the Clerk user to a
        staff record by its verified email (staff sign in by email code while Clerk can't text Ghana
        numbers) or verified phone the first time, then by Clerk user id. A phone number changed in Clerk
        shows up on the next call.
      security: [{ ownerAuth: [] }]
      responses:
        '200':
          description: The signed-in owner or staff member and the venues they can manage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Signed in with Clerk, but this email or number is on no Cravins team (code `not_staff`). The app asks them to get an invite from their venue owner.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---------------------------------------------------------------- guest session (from the QR code)
  /guest-sessions:
    post:
      tags: [guest-session]
      operationId: createGuestSession
      summary: Start a guest session after a QR scan. No account and no personal data.
      description: The QR code holds `https://cravins.app/{venueSlug}/t/{tableCode}`. The web app calls this on load.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueSlug]
              properties:
                venueSlug: { $ref: '#/components/schemas/Slug' }
                tableCode: { type: string, description: Missing when the guest opened the venue link without a table QR., example: '12' }
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '201':
          description: Session started.
          content:
            application/json:
              schema:
                type: object
                required: [guestToken, expiresAt, venue]
                properties:
                  guestToken: { type: string, description: Short-lived bearer token for guest calls. Kept in memory and sessionStorage only. }
                  expiresAt: { type: string, format: date-time }
                  venue: { $ref: '#/components/schemas/VenuePublic' }
                  table: { $ref: '#/components/schemas/Table' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- venues (public)
  /venues/{venueSlug}:
    get:
      tags: [venues]
      operationId: getVenue
      summary: Venue profile, theme, hours, and switched-on services for the guest home.
      parameters: [{ $ref: '#/components/parameters/VenueSlug' }, { $ref: '#/components/parameters/AcceptLanguage' }]
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenuePublic' }
        '304': { description: Not modified (send If-None-Match). }
        '404': { $ref: '#/components/responses/NotFound' }
  /venues/{venueSlug}/menu:
    get:
      tags: [menu]
      operationId: getMenu
      summary: Get menu.
      parameters: [{ $ref: '#/components/parameters/VenueSlug' }, { $ref: '#/components/parameters/AcceptLanguage' }]
      responses:
        '200':
          description: The full menu. Cache it for offline use (see BUILD.md, slow-network rules).
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '304': { description: Not modified. }
        '404': { $ref: '#/components/responses/NotFound' }
  /venues/{venueSlug}/wifi:
    get:
      tags: [venues]
      operationId: getWifi
      security: [{ guestAuth: [] }]
      summary: Wi-Fi details. Needs a guest session so the password is not public on the web.
      parameters: [{ $ref: '#/components/parameters/VenueSlug' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wifi' }
        '404': { $ref: '#/components/responses/NotFound' }
  /venues/{venueSlug}/offers:
    get:
      tags: [venues]
      operationId: listOffers
      summary: List offers.
      parameters: [{ $ref: '#/components/parameters/VenueSlug' }]
      responses:
        '200':
          description: Specials and offers running today.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Offer' } }

  # ---------------------------------------------------------------- orders (guest)
  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      security: [{ guestAuth: [] }]
      summary: "Place an order: for the guest's table, or from the menu link for pickup or delivery (send fulfilment). The server prices it from the menu, adds any delivery fee, and its total wins."
      description: |
        With X-Loyalty-Token, the order is linked to the guest's loyalty card at this venue (by the card's id,
        never the phone). When the order is paid and the venue stamps paid orders, one stamp goes on that card.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/LoyaltyTokenHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created with status `received` and payment status `unpaid`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      security: [{ guestAuth: [] }]
      summary: Order status for the Order status screen and the food-ready banner. Poll every 10 s while open.
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '304': { description: Not modified. }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{orderId}/bill:
    post:
      tags: [payments]
      operationId: quoteBill
      security: [{ guestAuth: [] }]
      summary: Work out what this guest pays (whole bill, equal split, or own items) plus tip. No money moves.
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillQuoteRequest' }
      responses:
        '200':
          description: The share to pay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillQuote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- payments (Paystack, server-side)
  /payments:
    post:
      tags: [payments]
      operationId: initializePayment
      security: [{ guestAuth: [] }]
      summary: Start a MoMo or card payment for a bill quote.
      description: |
        The server calls Paystack with the venue's own secret key (payment-settings/paystack), so the
        money goes straight to the venue's Paystack account. Cravins never holds funds and takes no cut.
        Fails with 409 online_pay_off when the venue has no Paystack connected (`payMethods.online` is false).
        MoMo returns `pay_offline`: show `displayText` and poll `GET /payments/{reference}`.
        The guest has 180 seconds to approve on their phone (network limit).
        Card returns `open_url` with a Paystack checkout URL: on the web open it in the same tab, in
        the app open it in the in-app browser. The server sets Paystack's callback URL to
        `{site}/{venueSlug}/pay`, and Paystack adds `?reference=…&trxref=…` when it sends the guest
        back. The app then calls `POST /payments/{reference}/verify`. Only `succeeded` counts; a card
        payment the guest cancelled or left comes back `abandoned`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitializePaymentRequest' }
      responses:
        '201':
          description: Payment started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/ProviderError' }
  /payments/{reference}:
    get:
      tags: [payments]
      operationId: getPayment
      security: [{ guestAuth: [] }]
      summary: Payment status. The server re-checks with Paystack (Verify Transaction) while still pending.
      parameters: [{ $ref: '#/components/parameters/PaymentReference' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/{reference}/verify:
    post:
      tags: [payments]
      operationId: verifyPayment
      security: [{ guestAuth: [] }]
      summary: Force a fresh check with Paystack (the "I've approved it" button, and after a card redirect).
      parameters: [{ $ref: '#/components/parameters/PaymentReference' }]
      responses:
        '200':
          description: The verified state. `succeeded` only when Paystack says success AND amount and currency match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/ProviderError' }
  /webhooks/paystack:
    post:
      tags: [webhooks]
      operationId: paystackWebhook
      summary: Server-to-server events from Paystack. Not called by the app.
      description: |
        Check `x-paystack-signature` = HMAC-SHA512(raw body, secret key) before reading the body.
        Handle `charge.success` idempotently (the same event can arrive twice). Re-verify the
        reference with Paystack and compare amount and currency before marking anything paid.
        Answer 200 fast. Port the logic from design/reference/table-qr-server.js.
      parameters:
        - in: header
          name: x-paystack-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, data]
              properties:
                event: { type: string, example: charge.success }
                data: { type: object, additionalProperties: true }
      responses:
        '200': { description: Received. }
        '401': { description: Bad signature. Nothing was changed. }

  # ---------------------------------------------------------------- waiter
  /waiter-calls:
    post:
      tags: [waiter]
      operationId: callWaiter
      summary: Call waiter.
      security: [{ guestAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/WaiterReason' }
                note: { type: string, maxLength: 140 }
      responses:
        '201':
          description: Staff were alerted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaiterCall' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /waiter-calls/{waiterCallId}:
    get:
      tags: [waiter]
      operationId: getWaiterCall
      summary: Get waiter call.
      security: [{ guestAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WaiterCallId' }]
      responses:
        '200':
          description: OK (shows "Kwesi is on the way" once acknowledged).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaiterCall' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- loyalty (guest, phone proved by OTP)
  /venues/{venueSlug}/loyalty:
    get:
      tags: [loyalty]
      operationId: getVenueLoyaltyProgram
      summary: Get the venue's loyalty programme (earn mode, tiers, rewards, expiry) before joining.
      parameters: [{ $ref: '#/components/parameters/VenueSlug' }]
      responses:
        '200':
          description: The venue's loyalty programme.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyProgram' }
        '404': { $ref: '#/components/responses/NotFound' }
  /venues/{venueSlug}/loyalty/me:
    get:
      tags: [loyalty]
      operationId: getMyLoyaltyCard
      summary: Get my loyalty card.
      security: [{ loyaltyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueSlug' }]
      responses:
        '200':
          description: The guest's loyalty card and fact ledger at this venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyCard' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [loyalty]
      operationId: joinLoyalty
      security: [{ loyaltyAuth: [] }]
      summary: Join the venue's loyalty program. Consent is required and recorded (Act 843).
      parameters: [{ $ref: '#/components/parameters/VenueSlug' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent]
              properties:
                firstName: { type: string, maxLength: 40 }
                birthdayMonthDay: { type: string, pattern: '^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$', description: Optional MM-DD for a birthday treat. }
                consent: { $ref: '#/components/schemas/ConsentInput' }
      responses:
        '200':
          description: Joined (or already a member, consent updated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyCard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [loyalty]
      operationId: leaveLoyalty
      security: [{ loyaltyAuth: [] }]
      summary: Withdraw consent and delete the guest's loyalty data at this venue.
      parameters: [{ $ref: '#/components/parameters/VenueSlug' }]
      responses:
        '204': { description: Deleted. }
  /venues/{venueSlug}/loyalty/me/redeem:
    post:
      tags: [loyalty]
      operationId: redeemReward
      summary: Open a short-lived redemption claim code for staff to confirm.
      security: [{ loyaltyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueSlug' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rewardId]
              properties:
                rewardId: { type: string }
                orderId: { $ref: '#/components/schemas/OrderId' }
      responses:
        '200':
          description: Claim opened. Staff confirmation is the only debit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyCard' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- reviews
  /reviews:
    post:
      tags: [reviews]
      operationId: createReview
      security: [{ guestAuth: [] }]
      summary: Written review. Every guest gets the same thank-you; the reply never depends on the star rating.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                highlights: { type: array, items: { type: string, enum: [food, service, speed, value, vibe, cleanliness] } }
                text: { type: string, maxLength: 1000 }
                orderId: { $ref: '#/components/schemas/OrderId' }
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [id, googleReviewUrl]
                properties:
                  id: { type: string }
                  googleReviewUrl: { type: ['string', 'null'], format: uri, description: 'Always null. Kept so older clients still parse; reviews are not routed by stars.' }
  # ---------------------------------------------------------------- game: Play while you wait
  /venues/{venueSlug}/game/leaderboard:
    get:
      tags: [game]
      operationId: getLeaderboard
      summary: Get leaderboard.
      parameters:
        - { $ref: '#/components/parameters/VenueSlug' }
        - in: query
          name: period
          schema: { type: string, enum: [week], default: week }
      responses:
        '200':
          description: Top 5 this week at this venue.
          content:
            application/json:
              schema:
                type: object
                required: [period, entries, stampRule]
                properties:
                  period: { type: string }
                  entries: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/LeaderboardEntry' } }
                  stampRule: { $ref: '#/components/schemas/GameStampRule' }
  /venues/{venueSlug}/game/scores:
    post:
      tags: [game]
      operationId: submitScore
      security: [{ guestAuth: [] }]
      summary: Save a score. Nickname is optional; without one nothing personal is stored.
      parameters:
        - { $ref: '#/components/parameters/VenueSlug' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/LoyaltyTokenHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score, runId, durationMs]
              properties:
                score: { type: integer, minimum: 0, maximum: 500 }
                runId: { type: string, format: uuid }
                durationMs: { type: integer, minimum: 0, description: Used by the server to reject impossible scores. }
                nickname: { type: string, minLength: 1, maxLength: 16 }
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [rank, stampEarned]
                properties:
                  rank: { type: ['integer', 'null'], description: 'Rank this week, null if outside the top 50.' }
                  stampEarned: { type: boolean, description: True only once per visit when the venue's stamp rule is on and the score reaches it. }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- private feedback
  /feedback:
    post:
      tags: [feedback]
      operationId: sendFeedback
      security: [{ guestAuth: [] }]
      summary: Private note to the manager. Never posted publicly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 3, maxLength: 1000 }
                contactPhone: { $ref: '#/components/schemas/GhanaPhone' }
      responses:
        '201': { description: Sent to the manager. }

  # ================================================================ OWNER / STAFF (ownerAuth)
  /owner/venues/{venueId}:
    get:
