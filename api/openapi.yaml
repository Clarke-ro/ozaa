      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: Everything the Customise screen edits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [owner-venue]
      operationId: ownerUpdateVenue
      security: [{ ownerAuth: [] }]
      summary: Update profile, hours, Wi-Fi, Google review link (partial update).
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueSettingsPatch' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /owner/venues/{venueId}/theme:
    put:
      tags: [owner-venue]
      operationId: ownerSetTheme
      security: [{ ownerAuth: [] }]
      summary: Save the venue colour and heading font. The server runs the same deriveTheme check and returns the safe colours and notes.
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThemeInput' }
      responses:
        '200':
          description: Saved. `derived` is what guests will see.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueTheme' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /owner/venues/{venueId}/media:
    post:
      tags: [owner-venue]
      operationId: ownerCreateMediaUpload
      security: [{ ownerAuth: [] }]
      summary: Upload URL for a banner, logo or dish photo (JPEG/PNG/WebP, max 5 MB). The server makes the sized copies.
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, contentType, sizeBytes]
              properties:
                kind: { type: string, enum: [banner, logo, dish_photo] }
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                sizeBytes: { type: integer, maximum: 5242880 }
      responses:
        '201':
          description: PUT the file to `uploadUrl`, then use `mediaId` in the venue or menu item.
          content:
            application/json:
              schema:
                type: object
                required: [mediaId, uploadUrl, expiresAt]
                properties:
                  mediaId: { type: string }
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
  /owner/venues/{venueId}/services:
    get:
      tags: [owner-venue]
      operationId: ownerGetServices
      summary: Get services (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: Every service with its on/off switch, plus the game stamp rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSettings' }
    put:
      tags: [owner-venue]
      operationId: ownerSetServices
      summary: Set services (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceSettings' }
      responses:
        '200':
          description: Saved. Guests see the change on their next load.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSettings' }
  /owner/venues/{venueId}/staff:
    get:
      tags: [owner-venue]
      operationId: ownerListStaff
      summary: List staff (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/StaffMember' } } } }
    post:
      tags: [owner-venue]
      operationId: ownerInviteStaff
      summary: Invite staff (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, firstName, role]
              properties:
                phone: { $ref: '#/components/schemas/GhanaPhone' }
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Where their sign-in code goes. Needed while staff sign in by email code (Clerk can't text Ghana numbers yet); without it they can only sign in once SMS works.
                firstName: { type: string, maxLength: 40 }
                role: { $ref: '#/components/schemas/StaffRole' }
      responses:
        '201':
          description: Invited. The server also creates their Clerk sign-in, so they can sign in with a code sent to their email (or, once Clerk can text Ghana numbers, their phone).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMember' }

  /owner/venues/{venueId}/menu/categories:
    get:
      tags: [owner-menu]
      operationId: ownerListCategories
      summary: List categories (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MenuCategory' } } } }
    post:
      tags: [owner-menu]
      operationId: ownerCreateCategory
      summary: Create category (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuCategoryInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuCategory' }
  /owner/venues/{venueId}/menu/categories/{categoryId}:
    patch:
      tags: [owner-menu]
      operationId: ownerUpdateCategory
      summary: Update category (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }, { $ref: '#/components/parameters/CategoryId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuCategoryInput' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuCategory' }
    delete:
      tags: [owner-menu]
      operationId: ownerDeleteCategory
      summary: Delete category (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }, { $ref: '#/components/parameters/CategoryId' }]
      responses:
        '204': { description: Deleted. }
        '409': { $ref: '#/components/responses/Conflict' }
  /owner/venues/{venueId}/menu/items:
    post:
      tags: [owner-menu]
      operationId: ownerCreateItem
      summary: Create item (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
  /owner/venues/{venueId}/menu/items/{menuItemId}:
    patch:
      tags: [owner-menu]
      operationId: ownerUpdateItem
      security: [{ ownerAuth: [] }]
      summary: Edit an item, including `available` for "sold out today".
      parameters: [{ $ref: '#/components/parameters/VenueId' }, { $ref: '#/components/parameters/MenuItemIdParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuItemInput' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuItem' }
    delete:
      tags: [owner-menu]
      operationId: ownerDeleteItem
      summary: Delete item (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }, { $ref: '#/components/parameters/MenuItemIdParam' }]
      responses:
        '204': { description: Deleted. }

  /owner/venues/{venueId}/tables:
    get:
      tags: [owner-tables]
      operationId: ownerListTables
      summary: List tables (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Table' } } } }
    post:
      tags: [owner-tables]
      operationId: ownerCreateTables
      security: [{ ownerAuth: [] }]
      summary: Add one or more tables (for example codes 1 to 12).
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                codes: { type: array, minItems: 1, maxItems: 200, items: { type: string, maxLength: 12 } }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Table' } } } }
  /owner/venues/{venueId}/tables/{tableId}/qr:
    get:
      tags: [owner-tables]
      operationId: ownerGetTableQr
      security: [{ ownerAuth: [] }]
      summary: Printable QR sticker for one table (Cravins logo in the middle, table number under it).
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { $ref: '#/components/parameters/TableId' }
        - in: query
          name: format
          schema: { type: string, enum: [svg, png, pdf], default: svg }
      responses:
        '200':
          description: The file.
          content:
            image/svg+xml: { schema: { type: string } }
            image/png: { schema: { type: string, contentMediaType: image/png } }
            application/pdf: { schema: { type: string, contentMediaType: application/pdf } }

  /owner/venues/{venueId}/orders:
    get:
      tags: [owner-orders]
      operationId: ownerListOrders
      security: [{ ownerAuth: [] }]
      summary: Orders dashboard. Poll every 5 s (realtime push comes later).
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: query
          name: status
          schema: { type: array, items: { $ref: '#/components/schemas/OrderStatus' } }
          style: form
          explode: false
        - in: query
          name: since
          description: Only orders created at or after this moment.
          schema: { type: string, format: date-time }
        - in: query
          name: until
          description: Only orders created before this moment. With since, a date range such as one day in the venue's time zone.
          schema: { type: string, format: date-time }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
    post:
      tags: [owner-orders]
      operationId: ownerCreateOrder
      security: [{ ownerAuth: [] }]
      summary: Staff enter an order by hand, for a guest at the counter or on the phone. Priced and stock-checked like a guest order.
      description: Owners, managers and waiters may do this. Works while the menu is unpublished, so staff can test before opening.
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerCreateOrderRequest' }
      responses:
        '201':
          description: Order created with status `received` and payment status `unpaid`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /owner/orders/{orderId}/status:
    put:
      tags: [owner-orders]
      operationId: ownerSetOrderStatus
      security: [{ ownerAuth: [] }]
      summary: Move an order forward. Only legal moves are accepted (see the Order state machine in BUILD.md).
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
                cancelReason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Saved. Setting `ready` fires the guest's food-ready banner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }
  /owner/venues/{venueId}/payment-settings:
    get:
      tags: [owner-payments]
      operationId: ownerGetPaymentSettings
      security: [{ ownerAuth: [] }]
      summary: "How this venue takes payment: its own Paystack account (if connected) and the manual methods. Owner only."
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: OK. The Paystack secret key is never returned, only its last 4 characters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /owner/venues/{venueId}/payment-settings/manual:
    put:
      tags: [owner-payments]
      operationId: ownerSetManualPayments
      security: [{ ownerAuth: [] }]
      summary: Switch cash, card machine, bank transfer and MoMo-to-merchant on or off, with their details.
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualPayments' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /owner/venues/{venueId}/payment-settings/fees:
    put:
      tags: [owner-payments]
      operationId: ownerSetFeePassing
      security: [{ ownerAuth: [] }]
      summary: Choose whether guests pay some or all of the Paystack fee on payments in the app.
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeePassing' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /owner/venues/{venueId}/payment-settings/paystack:
    put:
      tags: [owner-payments]
      operationId: ownerConnectPaystack
      security: [{ ownerAuth: [] }]
      summary: "Connect the venue's own Paystack account with its public and secret keys. The server checks them with Paystack first."
      description: |
        Money goes straight to the venue's Paystack account; Cravins never holds it. The secret key is
        stored encrypted on the server only. It is never returned, logged or sent to an app.
        Fails with paystack_keys_invalid (Paystack refused them), paystack_mode_mismatch (test keys
        in live mode or the reverse) or live_not_enabled (Cravins takes test keys only for now).
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaystackKeysInput' }
      responses:
        '200':
          description: Connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [owner-payments]
      operationId: ownerDisconnectPaystack
      security: [{ ownerAuth: [] }]
      summary: Remove the Paystack keys. Guests can no longer pay online; manual methods stay.
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: Disconnected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSettings' }
  /owner/venues/{venueId}/payment-settings/paystack/test:
    post:
      tags: [owner-payments]
      operationId: ownerTestPaystack
      security: [{ ownerAuth: [] }]
      summary: Check the saved keys still work with Paystack, without taking any money.
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: The result of the check.
          content:
            application/json:
              schema:
                type: object
                required: [ok, checkedAt]
                properties:
                  ok: { type: boolean }
                  checkedAt: { type: string, format: date-time }
                  message: { type: string, description: "Plain words, safe to show, when ok is false." }
  /owner/orders/{orderId}/manual-payment:
    post:
      tags: [owner-orders]
      operationId: ownerRecordManualPayment
      security: [{ ownerAuth: [] }]
      summary: Staff mark an order paid by cash, card machine, bank transfer or MoMo to the merchant number.
      description: Marks the whole order total as paid. Owners, managers and waiters. A second call for a paid order changes nothing.
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: '#/components/schemas/ManualPaymentMethod' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /owner/venues/{venueId}/waiter-calls:
    get:
      tags: [owner-orders]
      operationId: ownerListWaiterCalls
      summary: List waiter calls (owner app).
      security: [{ ownerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/VenueId' }
        - in: query
          name: open
          schema: { type: boolean, default: true }
        - in: query
          name: since
          description: With open=false, only calls made at or after this moment (for example since midnight in the venue's time zone). Newest first.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WaiterCall' } } } }
  /owner/waiter-calls/{waiterCallId}:
    patch:
      tags: [owner-orders]
      operationId: ownerUpdateWaiterCall
      summary: Update waiter call (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WaiterCallId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              description: "Send one of: a status, a reply, or a snooze. A reply also resolves the call. A snooze leaves the status alone."
              properties:
                status: { type: string, enum: [acknowledged, resolved], description: "acknowledged is \"On my way\": the guest sees the staff member's first name." }
                reply:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: A short message the guest sees on their phone, such as "Coming in 2 min". Resolves the call.
                snoozeMinutes:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: Hide the call from the queue for this long, then bring it back. The guest still sees it as waiting.
      responses:
        '200':
          description: Saved. `acknowledged` shows the staff member's first name to the guest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaiterCall' }

  /owner/venues/{venueId}/loyalty:
    get:
      tags: [owner-loyalty]
      operationId: ownerGetLoyalty
      summary: Get loyalty (owner app).
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
