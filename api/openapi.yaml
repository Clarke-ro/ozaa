          schema: { type: string, enum: [all, new, archived], default: new }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: List of feedback.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FeedbackItem' }

