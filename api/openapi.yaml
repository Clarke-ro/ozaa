      summary: Paystack sandbox charges and cash taken at the table.
      security: [{ ownerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/VenueId' }]
      responses:
        '200':
          description: Owner role only. Settlement is mocked until the live Paystack account exists.
