# .github/workflows/ci.yml: runs on every pull request
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_API_MODE: mock   # read at build time by expo export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The contract and its fixtures
      - run: npx @redocly/cli lint api/openapi.yaml
      - run: node api/fixtures/check-fixtures.mjs
      # Generated files must be up to date
      - run: npm run gen:api && npm run gen:tokens && git diff --exit-code src/lib/api/schema.ts src/theme/tokens.ts

      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test -- --ci

      # Never mention the old names
      - run: "! git grep -nI -i -e 'takeorder' -e 'scanchop' -- src app.config.ts"

      # Guest web build + Playwright screenshots against design/renders
      - run: npx expo export -p web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
